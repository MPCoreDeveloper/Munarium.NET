# The Munarium wire contract, v1.
#
# This file is the source of truth for BOTH transports. The JSON/HTTP surface implements it
# directly; the gRPC/protobuf surface is generated from it by SharpPortico, so the two cannot
# drift on names, shapes or enum values. Both are thin adapters over one operation surface
# (Munarium.Wire.MunariumOperations).
#
# Discipline: additive only within v1 - new fields, new operations, new enum values after
# "unspecified". A breaking change becomes v2 and is served side by side.
#
# Declared as OpenAPI 3.0.3 rather than 3.1: the generator now accepts a 3.1 document (it declares it
# 3.0 before parsing, because the bundled Microsoft.OpenApi 1.6.x refuses 3.1, and reports SP1002 to say
# so), but nothing in this contract needs a 3.1-only keyword and 3.0.3 is what every tool reads.
#
# Naming rules this contract has to respect, learned the hard way against SharpPortico 0.3.0-rc.1:
#   * a schema must not share a name with an operation's derived messages, because the generator
#     emits both "{OperationId}Request"/"Response" and the schema - and the generated file then
#     defines the type twice. That is why the search body is SearchQuery/SearchResult while the
#     operation is Search, and why the version creation body is VersionRequest while the operation
#     is CreateVersion.
#   * a schema must not have a property whose PascalCase name equals the schema name, because the
#     generated property and its enclosing class would collide (CS0542). That is why the head of a
#     version is the VersionHead schema, not Head.
openapi: 3.0.3
info:
  title: Munarium
  version: "1.0.0"
  description: |
    Munarium is a fact ledger with governance in the write path: a claim is judged before it is
    written, and a refused claim is recorded as disputed rather than dropped. Claims belong to a
    version, and a version is a node in a lineage, so an answer can always say which memory it came
    from. Reads are pinned with as_of, so what a pin saw stays what it saw, and a composed context
    is a pure function of a pin rather than a guess.
servers:
  - url: /
tags:
  - name: kernel
    description: Liveness and identity.
  - name: versions
    description: Memory versions and the lineage they form.
  - name: ledger
    description: The append-only fact ledger.
  - name: context
    description: Composing what a model would be given.
  - name: retrieval
    description: Evidence retrieval with provenance.
  - name: ingest
    description: Documents in, and where they went.
  - name: shapes
    description: What a claim is allowed to look like.

paths:
  /healthz:
    get:
      operationId: GetHealth
      tags: [kernel]
      summary: Liveness.
      responses:
        "200":
          description: The server is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /v1/versions:
    post:
      operationId: CreateVersion
      tags: [versions]
      summary: Create a version, which is itself a governed claim.
      description: |
        A version is not a table: it is a claim under the "version" shape, so it is judged by the
        same gates, pinned by the same feed and rebuilt from the same slice as every other fact.
        That makes a version id immutable by construction - claiming an existing id conflicts with
        the fact that already holds that lineage. Leave version_id empty to have one generated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRequest"
      responses:
        "200":
          description: The version that was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          description: The version could not be understood, or its parent does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The version's own claim was refused by a gate; the refusal is in the ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/versions/{version_id}/head:
    get:
      operationId: GetHead
      tags: [ledger]
      summary: The current head of a version.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version to read.
          schema:
            type: string
      responses:
        "200":
          description: The head of the version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionHead"

  /v1/versions/{version_id}/lineage:
    get:
      operationId: GetLineage
      tags: [versions]
      summary: The path from a lineage root down to a version, inclusive.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version to read the lineage of.
          schema:
            type: string
      responses:
        "200":
          description: The lineage, root first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionLineage"
        "404":
          description: No such version at the present pin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/versions/{version_id}/claims:
    post:
      operationId: ProposeClaim
      tags: [ledger]
      summary: Propose a claim, which governance then judges.
      description: |
        The model proposes and the mesh disposes: the claim runs the gates before it is written.
        A permitted claim is recorded as accepted, a refused one as disputed - the refusal is
        evidence in the ledger, not a lost write.

        claim_type says what the claim does to whatever the ledger already holds on the same
        lineage. "fact" (and leaving it out) asserts a value the ledger should not already hold, so
        a lineage that already carries one makes it a ledger conflict; "update" and "correction"
        both say why they are superseding, so they are allowed. That is what keeps "the value
        changed" and "the earlier value was wrong" distinguishable instead of one silent overwrite.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version to write to.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimProposal"
      responses:
        "200":
          description: The claim as recorded, with the verdict it was recorded under.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimOutcome"
        "400":
          description: The proposal is missing something the contract requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Every retry lost to a moving head. Retryable, never data loss.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/versions/{version_id}/claim-batches:
    post:
      operationId: ProposeClaimBatch
      tags: [ledger]
      summary: Propose a batch of claims, judged as one unit and landed as one append.
      description: |
        The candidate plane: everything a writer produced for a scope at once, judged against the head the
        gates read and landed as one conditional append. A blocked claim is recorded as disputed rather
        than dropped, so a batch is not a transaction that can half-succeed - it lands entirely or not at
        all, and the findings that judged it travel with it.

        The findings are the authoritative carrier of the verdict: the ledger keeps the rule that refused a
        claim, and the detail - which claim key, which values disagreed - belongs to the finding.

        These claims are semantic: subject.key=value, the vocabulary the gates reason over, with the claim
        type saying what the write does to what is already on the key. expected_head is a caller's pin: a
        batch that names one is answered with a contention instead of a re-gate, because it asked for a
        position rather than for an append.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version to write to.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimBatchRequest"
      responses:
        "200":
          description: The batch as recorded, with the verdicts it was recorded under.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimBatchOutcome"
        "400":
          description: A claim in the batch is missing something the contract requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The caller's pin was not the head, or every retry lost to a moving head.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/versions/{version_id}/findings:
    get:
      operationId: ListFindings
      tags: [ledger]
      summary: The findings a version's writes produced, oldest first.
      description: |
        A finding is the record of a verdict, so this is how a caller asks what governance decided and why -
        including the warnings that refused nothing. The position a finding carries is the write it belongs
        to, which is what makes it citable: a pin taken at that position still sees it.

        The findings live in the version's own stream, recorded in the same append as the claims they judged,
        so they are read under the same pin as those claims rather than from a second store that could be
        out of step with them.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version whose stream is read.
          schema:
            type: string
        - name: as_of
          in: query
          required: false
          description: |-
            The position to read as of, in the version's own stream - the head a write settled at - or 0 for
            every finding recorded. This is deliberately not the global feed position a facts read is pinned
            on: a finding is stamped with the write it belongs to, inside the version it belongs to.
          schema:
            type: integer
            format: int64
        - name: severity
          in: query
          required: false
          description: |-
            The severity to select - "info", "warn" or "block" - or empty for every severity.
          schema:
            type: string
        - name: rule_id
          in: query
          required: false
          description: The exact rule id to select, such as "gate.ledger-conflict", or empty.
          schema:
            type: string
        - name: rule_prefix
          in: query
          required: false
          description: |-
            A rule-id prefix to select - "gate." for the kernel's gates - or empty. It combines with rule_id
            by AND, which is only useful when both are set consistently.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: How many findings to return, oldest first, or 0 for all of them.
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: The findings, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingList"

  /v1/versions/{version_id}/anchors:
    post:
      operationId: LockAnchor
      tags: [command]
      summary: Lock a detail, so no claim may contradict it.
      description: |
        A lock asserts nothing and forbids one thing: that the locked value changes. That is why it is a command
        and not a claim - a claim is judged, a lock is a decision - and why a claim that contradicts a lock is
        reported as an anchor finding rather than as a ledger conflict.

        Locking a detail that is already locked replaces the earlier lock: the anchors plane is keyed by detail and
        the later event wins, so a re-lock is a deliberate restatement. The position in the answer is the position
        the write settled at inside the version's stream; a read of the plane reports the global position a pin is
        on.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version the lock is taken in.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnchorLock"
      responses:
        "200":
          description: The lock as recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Anchor"
        "400":
          description: The request is missing something the contract requires, or names no property to lock.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Every retry lost to a moving head. Retryable, never data loss.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: ListAnchors
      tags: [query]
      summary: The locked details as they stand at a pin.
      description: |
        Later version wins and released locks are absent: the plane is a state and not a log, which is what a gate
        can be judged against without second-guessing an entry.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version whose locked details are read.
          schema:
            type: string
        - name: as_of
          in: query
          required: false
          description: The position to read as of, or 0 for the present.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The locked anchors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnchorList"

  /v1/versions/{version_id}/anchors/{detail_key}/release:
    post:
      operationId: ReleaseAnchor
      tags: [command]
      summary: Release a lock, if there is one.
      description: |
        A release of a detail nobody locked is not a write: it would change nothing and still look like a command
        that did, so the answer says whether anything was released rather than pretending.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version the release is recorded in.
          schema:
            type: string
        - name: detail_key
          in: path
          required: true
          description: The locked detail, as "subject.key".
          schema:
            type: string
      responses:
        "200":
          description: Whether a lock was released.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnchorRelease"
        "400":
          description: The detail key names no property, so it cannot have been locked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Every retry lost to a moving head. Retryable, never data loss.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/versions/{version_id}/promises:
    post:
      operationId: OpenPromise
      tags: [command]
      summary: Register a promise one scope owes to another.
      description: |
        A promise is the mesh's own commitment, so it is recorded rather than judged: no gate refuses one, while
        the promise check reports one that is still open when its due scope is reached. Registering a key that is
        already registered restates it, because the plane is keyed by the coordination key.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version the promise is made in.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromiseRegistration"
      responses:
        "200":
          description: The promise as recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Promise"
        "400":
          description: The request is missing something the contract requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Every retry lost to a moving head. Retryable, never data loss.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: ListPromises
      tags: [query]
      summary: The promises as they stand at a pin.
      description: |
        The plane holds what was recorded, so a promise is open or fulfilled here - expiry and violation are
        judgements the promise check makes, not states the ledger stores. A fulfilment recorded after the pin reads
        back open, because a report over a past date must not use answers from the future.

        Asking for the overdue view computes the promise check's findings over the FULL pinned slice, before any
        status filter narrows it: a finding a filter could hide would be a finding nobody sees.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version whose promises are read.
          schema:
            type: string
        - name: as_of
          in: query
          required: false
          description: The position to read as of, or 0 for the present.
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          description: |-
            The status to select - "open" or "fulfilled" - or empty for every status.
          schema:
            type: string
        - name: overdue_scope
          in: query
          required: false
          description: |-
            Compute the promise check's findings for open promises due at this scope, or empty to skip it.
          schema:
            type: string
        - name: final
          in: query
          required: false
          description: Treat this read as the final unit, where every open promise is overdue.
          schema:
            type: boolean
      responses:
        "200":
          description: The promises, and the overdue findings when they were asked for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromiseList"

  /v1/versions/{version_id}/promises/{key}/fulfill:
    post:
      operationId: FulfillPromise
      tags: [command]
      summary: Fulfil the first open promise with a key.
      description: |
        Only an open promise is fulfilled, and only the first: fulfilling one that is already settled would record
        a settled obligation as settled again. A key with nothing open is answered with "not fulfilled" rather than
        an error, because the caller is told what happened instead of being punished for asking.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version the promise is fulfilled in.
          schema:
            type: string
        - name: key
          in: path
          required: true
          description: The promise's coordination key.
          schema:
            type: string
      responses:
        "200":
          description: Whether a promise was fulfilled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromiseFulfilment"
        "409":
          description: Every retry lost to a moving head. Retryable, never data loss.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/versions/{version_id}/counters:
    post:
      operationId: RecordCounter
      tags: [command]
      summary: Record a whole-document total for a counter.
      description: |
        A counter is an absolute total about the whole document rather than a delta, so recording one is an upsert: a
        reader must not have to sum a stream to know how often a pattern was used, because a budget checked against a
        sum changes meaning when an event is lost. A writer that records a lower total is therefore correcting the
        count - and the plane cannot tell a correction from an evasion, because a counter never sees the text it
        counts.

        The answer carries the total and whether it is over its budget, because the point of keeping a count is to
        tell the writer where it stands and not only that it overspent.

        No scope is recorded: the original sums per-scope counts into a key, which is the model this contract
        deliberately does not use.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version the count belongs to.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CounterRecording"
      responses:
        "200":
          description: The counter as recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Counter"
        "400":
          description: The request is missing a key, or counts something negative.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Every retry lost to a moving head. Retryable, never data loss.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: ListCounters
      tags: [query]
      summary: The counters at a pin, with the directives a writer would be given.
      description: |
        A budget the writer is not told about is only a way to fail it, so the directives travel with the totals: one
        usage line per budgeted counter, and an instruction not to use a pattern whose budget is exhausted. A counter
        with no budget has no line, because there is nothing to tell a writer about it.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version whose counters are read.
          schema:
            type: string
        - name: as_of
          in: query
          required: false
          description: The position to read as of, or 0 for the present.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The counters, and the directives that follow from them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CounterList"

  /v1/snapshots:
    get:
      operationId: LoadSnapshot
      tags: [ledger]
      summary: Everything the mesh holds at one pin, across every plane.
      description: |
        The audit read: one pin bounds facts, anchors, digests, promises, counters and entities at once, so a
        caller can see what the mesh believed at that position and hand the answer to someone else to check.

        Facts arrive resolved-current at the pin rather than as the writes that produced them; the scope filter
        and the fact limit are applied after that resolution, which is the only order that answers "the newest
        two facts of this scope" - filtering first would let a superseded fact occupy a slot and the reader
        would get fewer current facts than it asked for. The digest ladder is rebuilt from the pinned facts,
        because stored digest text has no history to read at a pin.

        "written_at" is derived from the identities the snapshot holds rather than read from a clock, so a
        verdict or a composition that depends on it can be rebuilt by anyone holding this answer.
      parameters:
        - name: version_id
          in: query
          required: false
          description: The version to read, or empty for every version.
          schema:
            type: string
        - name: as_of
          in: query
          required: false
          description: The position to read as of, or 0 for the present.
          schema:
            type: integer
            format: int64
        - name: scope
          in: query
          required: false
          description: A scope prefix to read, or empty for every scope.
          schema:
            type: string
        - name: fact_limit
          in: query
          required: false
          description: How many facts to keep, counting from the newest, or 0 for all of them.
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: The snapshot at that pin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"

  /v1/facts:
    get:
      operationId: SliceFacts
      tags: [ledger]
      summary: The facts that were current at a pin.
      description: |
        The slice is rebuilt from the ledger at the pin, never served from a cache, so the same
        pin rebuilds the same facts and therefore the same digest. Facts come back ordered by
        lineage, and each one names the version it was written to, so one version can be read out
        of the whole. The digest covers exactly the facts returned.
      parameters:
        - name: as_of
          in: query
          required: false
          description: The global position to read as of. 0 means the head.
          schema:
            type: integer
            format: int64
            default: 0
        - name: version_id
          in: query
          required: false
          description: Read one version instead of every version. Empty means every version.
          schema:
            type: string
            default: ""
      responses:
        "200":
          description: The slice and its digest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactSlice"

  /v1/context:
    post:
      operationId: ComposeContext
      tags: [context]
      summary: Compose the context a model would be given.
      description: |
        Composition is a pure function of the pinned facts, so the same pin composes the same text
        and the same content_hash - which makes the hash a cache key rather than a guess. Sections
        carry the accepted facts within the budget, and refused claims are listed separately under
        "Disputed", because a context that hid what the ledger refused would hide the one thing
        this system exists to keep visible.

        as_of_date resolves to a pin through the versions: the latest version whose as_of date is
        on or before it, and the global position that version was created at. as_of_date wins over
        as_of when both are given.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextRequest"
      responses:
        "200":
          description: The composed context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposedContext"
        "400":
          description: The request could not be understood.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No version reaches back as far as the given as_of_date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/search:
    post:
      operationId: Search
      tags: [retrieval]
      summary: Retrieve evidence for a question.
      description: |
        Returns evidence rather than bare similarity: every answer carries the provenance
        envelope naming which sources answered, which bytes they held when indexed, and which
        ledger position the index reflects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchQuery"
      responses:
        "200":
          description: The retrieved chunks and the envelope that seals them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"

  /v1/shapes:
    get:
      operationId: ListShapes
      tags: [shapes]
      summary: The shapes this deployment understands.
      responses:
        "200":
          description: The registered shapes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShapeList"

  /v1/sources:
    put:
      operationId: IngestSource
      tags: [ingest]
      summary: Ingest a document, and index what it says.
      description: |
        A source's identity is its logical path and not its content hash, so a re-ingest of one path is a new version
        of one source rather than a second source: the row is replaced, and the index identity - which pairs a source
        with its hash - notices that the bytes moved.

        The order is the contract. The media type is checked first, so a document this port cannot read leaves nothing
        behind; a declared hash is verified before the write, so a mismatch costs nothing; and nothing is indexed
        before the row exists, so every citation resolves to a path and a hash. An ingest that changes nothing writes
        nothing and embeds nothing, because a document indexed twice would answer twice and displace other documents by
        existing.

        The document travels as text rather than as bytes, because this port reads text: text/*, application/json and
        application/xml, as UTF-8. A deployment that ingests PDFs or DOCX brings an extractor of its own - the upstream
        extractors depend on a model capability this port has not ported - and until then a PDF is refused by name
        rather than indexed as bytes no query can find. A deployment that has to stream a large document puts an object
        store behind the source seam and hands over its location, which is what that seam is for.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceIngest"
      responses:
        "200":
          description: The document as stored, and how much of it reached the index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestedSource"
        "400":
          description: The request names no path, or a path a source may not hold.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: No extractor reads that media type, so nothing was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: What arrived is not what the caller declared, so nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/sources/{source_id}:
    get:
      operationId: GetSource
      tags: [ingest]
      summary: Where a document actually went.
      description: |
        Source metadata, and never the bytes. A row answers which path, which hash, which media type and which backend,
        so an operator can tell whether a document landed and where without the answer ever carrying the document.
      parameters:
        - name: source_id
          in: path
          required: true
          description: The source's identity, as "src-...".
          schema:
            type: string
      responses:
        "200":
          description: The source's metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceInfo"
        "404":
          description: No source with that identity was ingested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/indexes:
    post:
      operationId: BuildIndexVersion
      tags: [retrieval]
      summary: Build an index version over the sources a collection binds.
      description: |
        A build reads every bound source, cuts it, embeds it and writes it into a version nobody is answering from, so
        the version that is live keeps serving while a rebuild happens. The built version is kept, and activating it
        later is a cutover rather than a second build.

        Nothing is skipped quietly: a bound document whose media type this port cannot read refuses the build and names
        the path, and the half-built version is dropped with it - an index that answered with the documents the build
        got to before it stopped would be worse than no index at all. The ledger position is read rather than asked for,
        because a build reflects the state of the world it was made in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexBuild"
      responses:
        "200":
          description: The version as recorded, live when the build asked for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexVersionState"
        "400":
          description: The request names no collection or no shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Nothing was built - nothing is bound, or a bound document cannot be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/indexes/active:
    get:
      operationId: GetActiveIndexVersion
      tags: [retrieval]
      summary: The version a collection answers from.
      parameters:
        - name: collection_id
          in: query
          required: true
          description: The collection whose live version is read.
          schema:
            type: string
      responses:
        "200":
          description: The collection's live version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexVersionState"
        "404":
          description: The collection has no live version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/indexes/{index_version_id}:
    get:
      operationId: GetIndexVersion
      tags: [retrieval]
      summary: An index version, and what it was built from.
      parameters:
        - name: index_version_id
          in: path
          required: true
          description: The version's identity, as "idx-...".
          schema:
            type: string
      responses:
        "200":
          description: The version as it stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexVersionState"
        "404":
          description: No such version is recorded, so nothing can be explained by it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/indexes/{index_version_id}/activate:
    post:
      operationId: ActivateIndexVersion
      tags: [retrieval]
      summary: Cut a collection over to a version it already has.
      description: |
        The process is moved before the record is: a version this process never built cannot serve here, and refusing
        before anything changes leaves the record as it was. A cutover is reversible, and the version that stopped
        serving stays readable - an envelope issued while it was live still resolves.
      parameters:
        - name: index_version_id
          in: path
          required: true
          description: The version to make live.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexActivation"
      responses:
        "200":
          description: The activated version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexVersionState"
        "404":
          description: No such version belongs to that collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The version was not built in this process, so it cannot serve from here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/indexes/resolve:
    post:
      operationId: ResolveEnvelope
      tags: [retrieval]
      summary: Resolve an answer's provenance envelope back to its version.
      description: |
        The read that makes provenance worth carrying: it answers whether the bytes an answer cites were in the version
        it names, which is the part of a citation a mixed-up envelope cannot fake. An index version nobody recorded
        resolves to a failure rather than to an error, because "nobody recorded that" is an answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvelopeQuery"
      responses:
        "200":
          description: What the envelope resolves to, and whether it holds up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResolution"
        "400":
          description: The envelope names no version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  schemas:
    Problem:
      type: object
      description: A machine-actionable failure, mirroring RFC 9457 problem+json.
      required: [type, detail]
      properties:
        type:
          type: string
          description: A stable problem identifier, for example "https://munarium.dev/problems/contended-write".
        detail:
          type: string
        status:
          type: integer
          format: int32
        expected_head:
          type: integer
          format: int64
        actual_head:
          type: integer
          format: int64

    Health:
      type: object
      required: [status, contract]
      properties:
        status:
          type: string
          description: Always "ok" - a health check that answers at all is healthy.
        contract:
          type: string
          description: The wire contract version this server speaks, "mmp.v1".

    VersionHead:
      type: object
      required: [version_id, head]
      properties:
        version_id:
          type: string
        head:
          type: integer
          format: int64
          description: The last sequence number in the version. 0 means nothing has been written.

    Version:
      type: object
      required: [version_id, head]
      properties:
        version_id:
          type: string
          description: The version's identity, which is also the stream its claims are written to.
        parent_version_id:
          type: string
          description: The version it descends from. Empty when it starts a lineage.
        as_of_date:
          type: string
          description: The date this version is "as of", as YYYY-MM-DD. Empty when it declares none.
        label:
          type: string
          description: A label for humans.
        head:
          type: integer
          format: int64
          description: The version's own head.

    VersionLineage:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          description: The lineage from its root down to the requested version, inclusive.
          items:
            $ref: "#/components/schemas/Version"

    VersionRequest:
      type: object
      required: [actor]
      properties:
        version_id:
          type: string
          description: |
            The identity to use, or empty to have the server generate one. Identities are ULIDs, so
            a generated one sorts by creation time.
        parent_version_id:
          type: string
          description: The version to descend from, or empty for a lineage root.
        as_of_date:
          type: string
          description: The date this version is "as of", as YYYY-MM-DD, or empty.
        label:
          type: string
          description: A label for humans, or empty.
        actor:
          type: string
          description: Who is creating it.

    ClaimStatus:
      type: string
      description: |
        What the ledger recorded. "disputed" is a recorded outcome, not an error: the claim is in
        the ledger with the reason it was refused.
      enum:
        - unspecified
        - accepted
        - disputed
        - contended

    ClaimType:
      type: string
      description: |
        What a claim does to whatever the ledger already holds on its lineage. "unspecified" and
        "fact" both assert a value the ledger should not already hold, so a lineage that already
        carries one refuses them as a ledger conflict; "update" and "correction" say why they are
        superseding, so they are permitted.
      enum:
        - unspecified
        - fact
        - update
        - correction

    Snapshot:
      type: object
      description: |-
        The point-in-time view the gates and the composer read. Every plane shares one sequence axis, which is
        the whole reason a pin can be a single number: a reader that pinned facts and promises separately would
        have to invent a rule for the two pins disagreeing.
      required: [version_id, facts, anchors, digests, promises, counters, entities]
      properties:
        version_id:
          type: string
          description: The version the snapshot was taken of, or empty for every version.
        as_of_sequence:
          type: integer
          format: int64
          description: The position the snapshot was pinned at, or 0 for the present.
        as_of_date:
          type: string
          description: The calendar date it was read as of, or empty.
        written_at:
          type: string
          description: |-
            The instant the newest identity in the snapshot was created at, as RFC 3339, or empty when no
            identity is a ULID. This is not the pin: the pin says which writes are visible, this says when the
            newest visible write happened.
        written_on:
          type: string
          description: That instant as a calendar date, YYYY-MM-DD, or empty - what a chronology rule reads.
        facts:
          type: array
          description: The current facts at the pin, in ascending sequence order.
          items:
            $ref: "#/components/schemas/ResolvedClaim"
        anchors:
          type: array
          description: The locked anchors, later version winning, keyed by detail key.
          items:
            $ref: "#/components/schemas/Anchor"
        digests:
          type: array
          description: The digest ladder as it stands at the pin, rebuilt rather than served.
          items:
            $ref: "#/components/schemas/Digest"
        promises:
          type: array
          items:
            $ref: "#/components/schemas/Promise"
        counters:
          type: array
          items:
            $ref: "#/components/schemas/Counter"
        entities:
          type: array
          items:
            $ref: "#/components/schemas/Entity"

    CounterRecording:
      type: object
      description: A whole-document total, as a writer reports it.
      required: [key, total]
      properties:
        key:
          type: string
          description: The pattern the counter counts.
        total:
          type: integer
          format: int64
          description: |-
            The total as it stands, absolute rather than a delta: the number of times the pattern occurs in the
            document, not how many more times it occurred since the last record.
        budget:
          type: integer
          format: int64
          description: The ceiling the writer is working under, or 0 for none.

    CounterList:
      type: object
      required: [counters]
      properties:
        counters:
          type: array
          description: The counters at the pin.
          items:
            $ref: "#/components/schemas/Counter"
        directives:
          type: string
          description: |-
            One line per budgeted counter, and an instruction for one whose budget is exhausted; empty when no
            counter has a budget. A budget the writer is not told about is only a way to fail it.

    AnchorLock:
      type: object
      description: |-
        A lock, as the caller asks for it. The detail key is derived from subject and key rather than passed whole,
        so a lock always names a property a claim can be matched against.
      required: [subject, key, value]
      properties:
        subject:
          type: string
          description: The thing whose detail is locked.
        key:
          type: string
          description: The property of the subject.
        value:
          type: string
          description: The value the detail is pinned to.
        scope_path:
          type: string
          description: The scope the lock is taken at, or empty.
        evidence:
          type: string
          description: The evidence the lock is taken on, as JSON text, or empty.

    PromiseRegistration:
      type: object
      required: [key, kind, description]
      properties:
        key:
          type: string
          description: |-
            The coordination key. It identifies the obligation, so two obligations alive at once need two keys.
        kind:
          type: string
          description: What kind of promise it is.
        description:
          type: string
          description: The promise in words.
        origin_scope:
          type: string
          description: The scope it is made in, or empty.
        due_scope:
          type: string
          description: The scope it is owed to, or empty.

    AnchorRelease:
      type: object
      required: [released]
      properties:
        released:
          type: boolean
          description: |-
            False when nothing was locked. The answer says so rather than pretending, and nothing was written: a
            release that changed nothing must not look like a command that did.

    PromiseFulfilment:
      type: object
      required: [fulfilled]
      properties:
        fulfilled:
          type: boolean
          description: |-
            False when no promise with that key was open. A settled obligation is not settled twice, and a key with
            nothing open is not an error.

    AnchorList:
      type: object
      required: [anchors]
      properties:
        anchors:
          type: array
          description: The locked details, later version winning and released ones absent.
          items:
            $ref: "#/components/schemas/Anchor"

    PromiseList:
      type: object
      required: [promises]
      properties:
        promises:
          type: array
          description: The promises as they stand at the pin.
          items:
            $ref: "#/components/schemas/Promise"
        findings:
          type: array
          description: |-
            The promise check's overdue findings, when the read asked for them; empty otherwise. They are computed
            over the full pinned slice before any status filter narrows it.
          items:
            $ref: "#/components/schemas/Finding"

    AnchorStatus:
      type: string
      description: Whether a lock still holds. Only a locked anchor is judged against.
      enum:
        - unspecified
        - locked
        - released

    PromiseStatus:
      type: string
      description: What became of a promise, as of the pin.
      enum:
        - unspecified
        - open
        - fulfilled
        - expired
        - violated

    ResolvedClaim:
      type: object
      description: |-
        A claim as the kernel reasons over it: the triple, where it sits in the scope tree, and the provenance
        it was admitted under. The sequence is the position in the ledger as a whole, because that is the axis
        the pin is on.
      required: [claim_id, version_id, sequence, claim_type, subject, key, value, status, provenance]
      properties:
        claim_id:
          type: string
        version_id:
          type: string
        sequence:
          type: integer
          format: int64
        claim_type:
          $ref: "#/components/schemas/ClaimType"
        subject:
          type: string
        key:
          type: string
        value:
          type: string
        scope_path:
          type: string
          description: The dotted scope it was written in, or empty.
        status:
          $ref: "#/components/schemas/ClaimStatus"
        provenance:
          $ref: "#/components/schemas/Provenance"
        supersedes_id:
          type: string
          description: The claim it says it supersedes, or empty.

    Anchor:
      type: object
      description: |-
        A locked detail: while the anchor is locked, the detail key may not drift from the locked value. An
        anchor freezes one detail without freezing the whole subject.
      required: [anchor_id, version_id, detail_key, locked_value, status, sequence]
      properties:
        anchor_id:
          type: string
        version_id:
          type: string
        detail_key:
          type: string
          description: The locked detail, as "subject.key".
        locked_value:
          type: string
        locked_at_scope:
          type: string
          description: The scope the lock was taken at, or empty.
        status:
          $ref: "#/components/schemas/AnchorStatus"
        sequence:
          type: integer
          format: int64
        evidence:
          type: string
          description: The evidence the lock was taken on, as JSON text, or empty.

    Digest:
      type: object
      description: One rung of the digest ladder - a deterministic, model-free compression of facts under a scope.
      required: [version_id, tier, scope_path, content, content_hash, built_from_sequence]
      properties:
        version_id:
          type: string
        tier:
          type: integer
          format: int32
          description: 0 per scope, 1 per scope-prefix group, 2 the whole-lineage rollup.
        scope_path:
          type: string
          description: The scope the rung covers - the group name at tier 1, and empty for the rollup.
        content:
          type: string
        content_hash:
          type: string
          description: The SHA-256 of the content, as lowercase hex.
        built_from_sequence:
          type: integer
          format: int64
          description: The highest ledger position the rung was built from.

    Promise:
      type: object
      description: A promise made in one scope and owed to a later one.
      required: [promise_id, version_id, key, kind, description, status, sequence]
      properties:
        promise_id:
          type: string
        version_id:
          type: string
        key:
          type: string
        kind:
          type: string
        description:
          type: string
        origin_scope:
          type: string
          description: The scope it was made in, or empty.
        due_scope:
          type: string
          description: The scope it is owed to, or empty.
        status:
          $ref: "#/components/schemas/PromiseStatus"
        sequence:
          type: integer
          format: int64
          description: The position the promise was made at.
        fulfilled_sequence:
          type: integer
          format: int64
          description: The position it was fulfilled at, or 0 while it is open.

    Counter:
      type: object
      description: A whole-document frequency, with the ceiling it was declared under when it declared one.
      required: [key, total]
      properties:
        key:
          type: string
        total:
          type: integer
          format: int64
        budget:
          type: integer
          format: int64
          description: The declared ceiling, or 0 when the counter has none.
        over_budget:
          type: boolean
          description: Whether the total has passed the ceiling.

    Entity:
      type: object
      description: A resolved entity, and the aliases it was resolved from.
      required: [entity_id, version_id, canonical_name, sequence]
      properties:
        entity_id:
          type: string
        version_id:
          type: string
        canonical_name:
          type: string
        entity_type:
          type: string
          description: The entity's type, or empty.
        aliases:
          type: array
          items:
            type: string
        sequence:
          type: integer
          format: int64
        merged_into:
          type: string
          description: The entity this one was merged into, or empty.

    FindingList:
      type: object
      required: [findings]
      properties:
        findings:
          type: array
          description: The findings, oldest first.
          items:
            $ref: "#/components/schemas/StoredFinding"

    StoredFinding:
      type: object
      required: [sequence, finding]
      properties:
        sequence:
          type: integer
          format: int64
          description: |-
            The position the write settled at, which every finding of that write shares: the verdict belongs to
            the write and not to the individual rule that produced it.
        finding:
          $ref: "#/components/schemas/Finding"

    ClaimCandidate:
      type: object
      description: |-
        One claim as the candidate plane sees it: a semantic triple rather than a shaped body, because that
        is what the gates reason over. A batch may span scopes, so the scope travels per claim, and the
        candidate's own scope - the one a finding is reported against - is the first one any claim names.
      required: [subject, key, value]
      properties:
        claim_type:
          $ref: "#/components/schemas/ClaimType"
        subject:
          type: string
          description: The thing the claim is about.
        key:
          type: string
          description: The property of the subject.
        value:
          type: string
          description: The asserted value, as text.
        scope_path:
          type: string
          description: The dotted scope the claim was produced in, or empty for none.
        provenance:
          $ref: "#/components/schemas/Provenance"
        supersedes_id:
          type: string
          description: The claim this one says it supersedes, or empty when it names none.

    ClaimBatchRequest:
      type: object
      required: [claims]
      properties:
        claims:
          type: array
          description: The proposals in the batch, in the order they were produced.
          items:
            $ref: "#/components/schemas/ClaimCandidate"
        text:
          type: string
          description: |-
            The text the text-shaped gates read - meta-leakage and repetition judge a unit of text, not a
            claim - or empty when the batch produced none.
        expected_head:
          type: integer
          format: int64
          description: |-
            The head the caller requires, or 0 to append at whatever the head is. A caller that pins one
            gets a contention instead of a re-gate.

    Provenance:
      type: string
      description: How a claim came to exist.
      enum:
        - unspecified
        - witnessed
        - backfilled
        - repaired
        - emergent
        - coverage_repair

    Severity:
      type: string
      description: How serious a finding is. Only "block" refuses a claim.
      enum:
        - unspecified
        - info
        - warn
        - block

    Finding:
      type: object
      description: |-
        One thing a gate had to say about a batch. Findings accumulate, because a batch can break several
        rules at once and an operator who fixes one of them should not have to re-run to discover the next.
      required: [rule_id, severity, message]
      properties:
        rule_id:
          type: string
          description: The dotted rule identifier, such as "gate.ledger-conflict".
        severity:
          $ref: "#/components/schemas/Severity"
        message:
          type: string
          description: The finding in the operator's words.
        scope_path:
          type: string
          description: The scope the batch was judged in, or empty.
        claim_key:
          type: string
          description: |-
            The claim this finding disputes, or empty when it names none - a meta-leakage finding is about
            a unit of text and cannot dispute one claim.
        detail:
          type: string
          description: |-
            The structured detail as JSON text. The kernel does not interpret it, so the contract carries it
            verbatim rather than promising a shape it would have to keep in step.

    ClaimBatchOutcome:
      type: object
      required: [version_id, head, claims, findings]
      properties:
        version_id:
          type: string
        head:
          type: integer
          format: int64
          description: The version's head after the append.
        claims:
          type: array
          description: The claims as recorded, in the order they were proposed.
          items:
            $ref: "#/components/schemas/ClaimOutcome"
        findings:
          type: array
          description: Every finding the gates produced, including the warnings that refused nothing.
          items:
            $ref: "#/components/schemas/Finding"
        findings_sequence:
          type: integer
          format: int64
          description: The position the findings were recorded at, or 0 when the write produced none.

    ClaimProposal:
      type: object
      required: [claim_id, shape, body, statement, actor]
      properties:
        claim_id:
          type: string
          description: The claim's identity, unique within the version.
        claim_type:
          $ref: "#/components/schemas/ClaimType"
        shape:
          type: string
          description: |
            The shape this claim is made under. The shape supplies both the schema the body is
            validated against and the identity fields that decide supersession.
        body:
          type: string
          description: The structured fact body, JSON-encoded and validated against the shape.
        statement:
          type: string
          description: The claim in the actor's words.
        actor:
          type: string
          description: Who is asserting it.

    ClaimOutcome:
      type: object
      required: [version_id, claim_id, claim_type, lineage, status, head]
      properties:
        version_id:
          type: string
        claim_id:
          type: string
        claim_type:
          $ref: "#/components/schemas/ClaimType"
        lineage:
          type: string
          description: |
            Derived by the kernel from the shape's identity fields over the body, so a caller
            cannot get supersession wrong.
        status:
          $ref: "#/components/schemas/ClaimStatus"
        gate:
          type: string
          description: The gate that refused the claim. Empty when it was accepted.
        reason:
          type: string
        head:
          type: integer
          format: int64
          description: The version's head after the write.

    Fact:
      type: object
      required: [version_id, claim_id, claim_type, lineage, statement, actor, status, sequence]
      properties:
        version_id:
          type: string
          description: The version the fact was written to.
        claim_id:
          type: string
        claim_type:
          $ref: "#/components/schemas/ClaimType"
        lineage:
          type: string
        statement:
          type: string
        actor:
          type: string
        status:
          $ref: "#/components/schemas/ClaimStatus"
        gate:
          type: string
        reason:
          type: string
        sequence:
          type: integer
          format: int64
          description: The global position that made this fact the current one.

    FactSlice:
      type: object
      required: [as_of, digest, facts]
      properties:
        as_of:
          type: integer
          format: int64
          description: The pin this slice was taken at.
        digest:
          type: string
          description: SHA-256 over exactly the facts above, lowercase hex. A later event cannot change it.
        facts:
          type: array
          items:
            $ref: "#/components/schemas/Fact"

    ContextSection:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
        body:
          type: string

    ContextRequest:
      type: object
      properties:
        version_id:
          type: string
          description: Compose one version, or empty for every version.
        shape:
          type: string
          description: Compose one shape, or empty for every shape.
        as_of:
          type: integer
          format: int64
          default: 0
          description: The global position to compose as of. 0 means the present.
        as_of_date:
          type: string
          description: |
            A date, as YYYY-MM-DD, resolved to a pin through the versions. Wins over as_of when both
            are given.
        budget_tokens:
          type: integer
          format: int32
          default: 0
          description: |
            The token budget for facts. 0 means unbounded. The estimate is four characters per
            token, rounded up - deliberately not a tokeniser, because the estimate has to be
            reproducible or the content hash means nothing.
        fact_limit:
          type: integer
          format: int32
          default: 0
          description: How many facts may be included. 0 means unbounded.

    ComposedContext:
      type: object
      required: [sections, text, estimated_tokens, content_hash, as_of]
      properties:
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ContextSection"
        text:
          type: string
          description: The composed text, which is the concatenation of the section bodies.
        estimated_tokens:
          type: integer
          format: int32
          description: The token estimate for the text.
        content_hash:
          type: string
          description: SHA-256 over the text, lowercase hex. The same pin composes the same hash.
        as_of:
          type: integer
          format: int64
          description: The pin it was composed at.

    SourceReference:
      type: object
      required: [chunk_id, source_id, source_path, content_hash, chunk_ordinal]
      properties:
        chunk_id:
          type: string
        source_id:
          type: string
        source_path:
          type: string
          description: The logical path the document was stored under - which document answered.
        content_hash:
          type: string
          description: The document's content hash, which proves which bytes it held when indexed.
        chunk_ordinal:
          type: integer
          format: int32

    ProvenanceEnvelope:
      type: object
      required: [index_version, ledger_watermark, sources]
      properties:
        index_version:
          type: string
          description: The immutable index version the answer came from.
        ledger_watermark:
          type: integer
          format: int64
          description: The ledger position the index reflects.
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceReference"

    RetrievedChunk:
      type: object
      required: [source, score, text]
      properties:
        source:
          $ref: "#/components/schemas/SourceReference"
        score:
          type: number
          format: double
        text:
          type: string

    SearchQuery:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: The question, which drives the lexical leg.
        top_k:
          type: integer
          format: int32
          default: 10

    SearchResult:
      type: object
      required: [chunks, envelope]
      properties:
        chunks:
          type: array
          items:
            $ref: "#/components/schemas/RetrievedChunk"
        envelope:
          $ref: "#/components/schemas/ProvenanceEnvelope"

    Shape:
      type: object
      required: [name, version, identity, schema]
      properties:
        name:
          type: string
        version:
          type: integer
          format: int32
        identity:
          type: array
          description: The body keys that identify a claim lineage.
          items:
            type: string
        schema:
          type: string
          description: The JSON Schema a fact body must satisfy, JSON-encoded.

    ShapeList:
      type: object
      required: [shapes]
      properties:
        shapes:
          type: array
          items:
            $ref: "#/components/schemas/Shape"

    SourceIngest:
      type: object
      required: [path, media_type, content]
      properties:
        path:
          type: string
          description: |
            The logical path, which is the source's identity: the same bytes at two paths are two sources, and the same
            path with different bytes is one source replaced.
        media_type:
          type: string
          description: The media type of the text, with or without parameters, for example "text/plain; charset=utf-8".
        content:
          type: string
          description: |
            The document's text. It travels as text rather than as bytes because this port reads text, and a declared
            hash is taken over its UTF-8 encoding.
        content_sha256:
          type: string
          description: |
            The hash the caller declares, in the canonical form ("sha256:" and lower-case hex), or empty to have the
            server hash what arrived. A declaration that does not match is refused before anything is written.

    IngestedSource:
      type: object
      required: [source_id, path, kind, content_hash, chunks_indexed, index_version]
      properties:
        source_id:
          type: string
          description: The source's identity, derived from the tenant and the path.
        path:
          type: string
        kind:
          type: string
          description: |
            What the ingest did to the path: "new" when it was not a source before, "replaced" when it held different
            bytes, "unchanged" when it already held exactly these bytes - in which case nothing was written and nothing
            was indexed.
        media_type:
          type: string
        content_hash:
          type: string
          description: The hash of the bytes stored, in the canonical form.
        bytes:
          type: integer
          format: int64
          description: How many bytes of UTF-8 that is.
        blob_uri:
          type: string
          description: Where the bytes went, as the backend resolved it, so an operator is not left guessing.
        backend_id:
          type: string
        ingested_at:
          type: string
          description: When the row was written, as the backend recorded it.
        chunks_indexed:
          type: integer
          format: int32
          description: |
            How many chunks were written into the index. Reported rather than assumed, because a document that is
            stored and not indexed - because it held no text, or because it was already there - is a real state.
        index_version:
          type: string
          description: The index version the chunks were written into, which is what an answer from them will cite.

    SourceInfo:
      type: object
      required: [source_id, path, content_hash]
      properties:
        source_id:
          type: string
        path:
          type: string
        media_type:
          type: string
        content_hash:
          type: string
          description: The hash of the bytes this path holds now, which is not the same question as what it held.
        bytes:
          type: integer
          format: int64
        blob_uri:
          type: string
        backend_id:
          type: string
        ingested_at:
          type: string

    IndexManifest:
      type: object
      description: |
        What an index version was built from. Every field is identity material - the embedder, the chunker, the
        extractors and the engine all change what a query would match - so a manifest explains a version rather than
        describing one.
      required: [collection_id, engine, chunker, extractors, embedder, source_content_hashes]
      properties:
        collection_id:
          type: string
        collection_name:
          type: string
        shape_ref:
          type: string
        engine:
          type: string
          description: The retrieval engine that built the vectors, as a versioned reference such as "flat@1".
        chunker:
          type: string
          description: The chunker's version, such as "chunk@1".
        extractors:
          type: string
          description: The extractors' version, such as "text@1".
        embedder:
          type: string
          description: The embedder's fingerprint, as "provider/model@dimensions".
        max_chars:
          type: integer
          format: int32
        source_content_hashes:
          type: array
          description: The hash of every source the version indexed, sorted.
          items:
            type: string

    IndexVersionState:
      type: object
      required: [index_version_id, collection_id, shape_ref, watermark, active, superseded, manifest]
      properties:
        index_version_id:
          type: string
        collection_id:
          type: string
        shape_ref:
          type: string
        watermark:
          type: integer
          format: int64
          description: The ledger position the version was built against, which is where a citation ends.
        active:
          type: boolean
          description: Whether the version is the collection's live one.
        superseded:
          type: boolean
          description: Whether it was once live and is not now. A superseded version stays readable.
        activated_at:
          type: string
          description: When the version first went live.
        deactivated_at:
          type: string
          description: When it stopped being live.
        manifest:
          $ref: "#/components/schemas/IndexManifest"

    IndexBuild:
      type: object
      required: [collection_id, shape_ref]
      properties:
        collection_id:
          type: string
          description: The collection the version belongs to.
        collection_name:
          type: string
          description: A name for humans, defaulting to the collection's id.
        shape_ref:
          type: string
          description: The contract shape the corpus is mapped through.
        path_prefix:
          type: string
          description: |
            The path prefix that binds the collection, or empty for every source this deployment has. The binding is in
            the request rather than in the manifest: which sources a collection binds can change without the version
            changing.
        activate:
          type: boolean
          description: Whether the built version becomes the collection's live one. Off unless the caller says so.

    IndexActivation:
      type: object
      required: [collection_id]
      properties:
        collection_id:
          type: string
          description: The collection to cut over. A version can only be activated into its own collection.

    EnvelopeQuery:
      type: object
      required: [index_version]
      properties:
        index_version:
          type: string
          description: The version the answer named.
        ledger_watermark:
          type: integer
          format: int64
          description: The ledger position the answer's index reflected.
        sources:
          type: array
          description: The sources the answer cited.
          items:
            $ref: "#/components/schemas/SourceReference"

    EnvelopeResolution:
      type: object
      required: [resolved, unrecorded_content_hashes]
      properties:
        resolved:
          type: boolean
          description: Whether the version exists and the cited bytes are in it.
        failure:
          type: string
          description: Why the provenance does not hold up, or empty when it does.
        version:
          $ref: "#/components/schemas/IndexVersionState"
        unrecorded_content_hashes:
          type: array
          description: |
            The cited hashes the version's manifest does not record. A version records the bytes it indexed, so an
            answer citing bytes outside that set cannot have come from it - which is the part of provenance a mixed-up
            envelope cannot fake.
          items:
            type: string

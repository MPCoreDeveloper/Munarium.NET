# The Munarium wire contract, v1.
#
# This file is the source of truth for BOTH transports. The JSON/HTTP surface implements it
# directly; the gRPC/protobuf surface is generated from it by SharpPortico, so the two cannot
# drift on names, shapes or enum values. Both are thin adapters over one operation surface
# (Munarium.Wire.MunariumOperations).
#
# Discipline: additive only within v1 - new fields, new operations, new enum values after
# "unspecified". A breaking change becomes v2 and is served side by side.
#
# Declared as OpenAPI 3.0.3 rather than 3.1: the generator now accepts a 3.1 document (it declares it
# 3.0 before parsing, because the bundled Microsoft.OpenApi 1.6.x refuses 3.1, and reports SP1002 to say
# so), but nothing in this contract needs a 3.1-only keyword and 3.0.3 is what every tool reads.
#
# Naming rules this contract has to respect, learned the hard way against SharpPortico 0.3.0-rc.1:
#   * a schema must not share a name with an operation's derived messages, because the generator
#     emits both "{OperationId}Request"/"Response" and the schema - and the generated file then
#     defines the type twice. That is why the search body is SearchQuery/SearchResult while the
#     operation is Search, and why the version creation body is VersionRequest while the operation
#     is CreateVersion.
#   * a schema must not have a property whose PascalCase name equals the schema name, because the
#     generated property and its enclosing class would collide (CS0542). That is why the head of a
#     version is the VersionHead schema, not Head.
openapi: 3.0.3
info:
  title: Munarium
  version: "1.0.0"
  description: |
    Munarium is a fact ledger with governance in the write path: a claim is judged before it is
    written, and a refused claim is recorded as disputed rather than dropped. Claims belong to a
    version, and a version is a node in a lineage, so an answer can always say which memory it came
    from. Reads are pinned with as_of, so what a pin saw stays what it saw, and a composed context
    is a pure function of a pin rather than a guess.
servers:
  - url: /
tags:
  - name: kernel
    description: Liveness and identity.
  - name: versions
    description: Memory versions and the lineage they form.
  - name: ledger
    description: The append-only fact ledger.
  - name: context
    description: Composing what a model would be given.
  - name: retrieval
    description: Evidence retrieval with provenance.
  - name: shapes
    description: What a claim is allowed to look like.

paths:
  /healthz:
    get:
      operationId: GetHealth
      tags: [kernel]
      summary: Liveness.
      responses:
        "200":
          description: The server is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /v1/versions:
    post:
      operationId: CreateVersion
      tags: [versions]
      summary: Create a version, which is itself a governed claim.
      description: |
        A version is not a table: it is a claim under the "version" shape, so it is judged by the
        same gates, pinned by the same feed and rebuilt from the same slice as every other fact.
        That makes a version id immutable by construction - claiming an existing id conflicts with
        the fact that already holds that lineage. Leave version_id empty to have one generated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRequest"
      responses:
        "200":
          description: The version that was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          description: The version could not be understood, or its parent does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The version's own claim was refused by a gate; the refusal is in the ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/versions/{version_id}/head:
    get:
      operationId: GetHead
      tags: [ledger]
      summary: The current head of a version.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version to read.
          schema:
            type: string
      responses:
        "200":
          description: The head of the version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionHead"

  /v1/versions/{version_id}/lineage:
    get:
      operationId: GetLineage
      tags: [versions]
      summary: The path from a lineage root down to a version, inclusive.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version to read the lineage of.
          schema:
            type: string
      responses:
        "200":
          description: The lineage, root first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionLineage"
        "404":
          description: No such version at the present pin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/versions/{version_id}/claims:
    post:
      operationId: ProposeClaim
      tags: [ledger]
      summary: Propose a claim, which governance then judges.
      description: |
        The model proposes and the mesh disposes: the claim runs the gates before it is written.
        A permitted claim is recorded as accepted, a refused one as disputed - the refusal is
        evidence in the ledger, not a lost write.

        claim_type says what the claim does to whatever the ledger already holds on the same
        lineage. "fact" (and leaving it out) asserts a value the ledger should not already hold, so
        a lineage that already carries one makes it a ledger conflict; "update" and "correction"
        both say why they are superseding, so they are allowed. That is what keeps "the value
        changed" and "the earlier value was wrong" distinguishable instead of one silent overwrite.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version to write to.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimProposal"
      responses:
        "200":
          description: The claim as recorded, with the verdict it was recorded under.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimOutcome"
        "400":
          description: The proposal is missing something the contract requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Every retry lost to a moving head. Retryable, never data loss.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/facts:
    get:
      operationId: SliceFacts
      tags: [ledger]
      summary: The facts that were current at a pin.
      description: |
        The slice is rebuilt from the ledger at the pin, never served from a cache, so the same
        pin rebuilds the same facts and therefore the same digest. Facts come back ordered by
        lineage, and each one names the version it was written to, so one version can be read out
        of the whole. The digest covers exactly the facts returned.
      parameters:
        - name: as_of
          in: query
          required: false
          description: The global position to read as of. 0 means the head.
          schema:
            type: integer
            format: int64
            default: 0
        - name: version_id
          in: query
          required: false
          description: Read one version instead of every version. Empty means every version.
          schema:
            type: string
            default: ""
      responses:
        "200":
          description: The slice and its digest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactSlice"

  /v1/context:
    post:
      operationId: ComposeContext
      tags: [context]
      summary: Compose the context a model would be given.
      description: |
        Composition is a pure function of the pinned facts, so the same pin composes the same text
        and the same content_hash - which makes the hash a cache key rather than a guess. Sections
        carry the accepted facts within the budget, and refused claims are listed separately under
        "Disputed", because a context that hid what the ledger refused would hide the one thing
        this system exists to keep visible.

        as_of_date resolves to a pin through the versions: the latest version whose as_of date is
        on or before it, and the global position that version was created at. as_of_date wins over
        as_of when both are given.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextRequest"
      responses:
        "200":
          description: The composed context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposedContext"
        "400":
          description: The request could not be understood.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No version reaches back as far as the given as_of_date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/search:
    post:
      operationId: Search
      tags: [retrieval]
      summary: Retrieve evidence for a question.
      description: |
        Returns evidence rather than bare similarity: every answer carries the provenance
        envelope naming which sources answered, which bytes they held when indexed, and which
        ledger position the index reflects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchQuery"
      responses:
        "200":
          description: The retrieved chunks and the envelope that seals them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"

  /v1/shapes:
    get:
      operationId: ListShapes
      tags: [shapes]
      summary: The shapes this deployment understands.
      responses:
        "200":
          description: The registered shapes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShapeList"
components:
  schemas:
    Problem:
      type: object
      description: A machine-actionable failure, mirroring RFC 9457 problem+json.
      required: [type, detail]
      properties:
        type:
          type: string
          description: A stable problem identifier, for example "https://munarium.dev/problems/contended-write".
        detail:
          type: string
        status:
          type: integer
          format: int32
        expected_head:
          type: integer
          format: int64
        actual_head:
          type: integer
          format: int64

    Health:
      type: object
      required: [status, contract]
      properties:
        status:
          type: string
          description: Always "ok" - a health check that answers at all is healthy.
        contract:
          type: string
          description: The wire contract version this server speaks, "mmp.v1".

    VersionHead:
      type: object
      required: [version_id, head]
      properties:
        version_id:
          type: string
        head:
          type: integer
          format: int64
          description: The last sequence number in the version. 0 means nothing has been written.

    Version:
      type: object
      required: [version_id, head]
      properties:
        version_id:
          type: string
          description: The version's identity, which is also the stream its claims are written to.
        parent_version_id:
          type: string
          description: The version it descends from. Empty when it starts a lineage.
        as_of_date:
          type: string
          description: The date this version is "as of", as YYYY-MM-DD. Empty when it declares none.
        label:
          type: string
          description: A label for humans.
        head:
          type: integer
          format: int64
          description: The version's own head.

    VersionLineage:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          description: The lineage from its root down to the requested version, inclusive.
          items:
            $ref: "#/components/schemas/Version"

    VersionRequest:
      type: object
      required: [actor]
      properties:
        version_id:
          type: string
          description: |
            The identity to use, or empty to have the server generate one. Identities are ULIDs, so
            a generated one sorts by creation time.
        parent_version_id:
          type: string
          description: The version to descend from, or empty for a lineage root.
        as_of_date:
          type: string
          description: The date this version is "as of", as YYYY-MM-DD, or empty.
        label:
          type: string
          description: A label for humans, or empty.
        actor:
          type: string
          description: Who is creating it.

    ClaimStatus:
      type: string
      description: |
        What the ledger recorded. "disputed" is a recorded outcome, not an error: the claim is in
        the ledger with the reason it was refused.
      enum:
        - unspecified
        - accepted
        - disputed
        - contended

    ClaimType:
      type: string
      description: |
        What a claim does to whatever the ledger already holds on its lineage. "unspecified" and
        "fact" both assert a value the ledger should not already hold, so a lineage that already
        carries one refuses them as a ledger conflict; "update" and "correction" say why they are
        superseding, so they are permitted.
      enum:
        - unspecified
        - fact
        - update
        - correction

    ClaimProposal:
      type: object
      required: [claim_id, shape, body, statement, actor]
      properties:
        claim_id:
          type: string
          description: The claim's identity, unique within the version.
        claim_type:
          $ref: "#/components/schemas/ClaimType"
        shape:
          type: string
          description: |
            The shape this claim is made under. The shape supplies both the schema the body is
            validated against and the identity fields that decide supersession.
        body:
          type: string
          description: The structured fact body, JSON-encoded and validated against the shape.
        statement:
          type: string
          description: The claim in the actor's words.
        actor:
          type: string
          description: Who is asserting it.

    ClaimOutcome:
      type: object
      required: [version_id, claim_id, claim_type, lineage, status, head]
      properties:
        version_id:
          type: string
        claim_id:
          type: string
        claim_type:
          $ref: "#/components/schemas/ClaimType"
        lineage:
          type: string
          description: |
            Derived by the kernel from the shape's identity fields over the body, so a caller
            cannot get supersession wrong.
        status:
          $ref: "#/components/schemas/ClaimStatus"
        gate:
          type: string
          description: The gate that refused the claim. Empty when it was accepted.
        reason:
          type: string
        head:
          type: integer
          format: int64
          description: The version's head after the write.

    Fact:
      type: object
      required: [version_id, claim_id, claim_type, lineage, statement, actor, status, sequence]
      properties:
        version_id:
          type: string
          description: The version the fact was written to.
        claim_id:
          type: string
        claim_type:
          $ref: "#/components/schemas/ClaimType"
        lineage:
          type: string
        statement:
          type: string
        actor:
          type: string
        status:
          $ref: "#/components/schemas/ClaimStatus"
        gate:
          type: string
        reason:
          type: string
        sequence:
          type: integer
          format: int64
          description: The global position that made this fact the current one.

    FactSlice:
      type: object
      required: [as_of, digest, facts]
      properties:
        as_of:
          type: integer
          format: int64
          description: The pin this slice was taken at.
        digest:
          type: string
          description: SHA-256 over exactly the facts above, lowercase hex. A later event cannot change it.
        facts:
          type: array
          items:
            $ref: "#/components/schemas/Fact"

    ContextSection:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
        body:
          type: string

    ContextRequest:
      type: object
      properties:
        version_id:
          type: string
          description: Compose one version, or empty for every version.
        shape:
          type: string
          description: Compose one shape, or empty for every shape.
        as_of:
          type: integer
          format: int64
          default: 0
          description: The global position to compose as of. 0 means the present.
        as_of_date:
          type: string
          description: |
            A date, as YYYY-MM-DD, resolved to a pin through the versions. Wins over as_of when both
            are given.
        budget_tokens:
          type: integer
          format: int32
          default: 0
          description: |
            The token budget for facts. 0 means unbounded. The estimate is four characters per
            token, rounded up - deliberately not a tokeniser, because the estimate has to be
            reproducible or the content hash means nothing.
        fact_limit:
          type: integer
          format: int32
          default: 0
          description: How many facts may be included. 0 means unbounded.

    ComposedContext:
      type: object
      required: [sections, text, estimated_tokens, content_hash, as_of]
      properties:
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ContextSection"
        text:
          type: string
          description: The composed text, which is the concatenation of the section bodies.
        estimated_tokens:
          type: integer
          format: int32
          description: The token estimate for the text.
        content_hash:
          type: string
          description: SHA-256 over the text, lowercase hex. The same pin composes the same hash.
        as_of:
          type: integer
          format: int64
          description: The pin it was composed at.

    SourceReference:
      type: object
      required: [chunk_id, source_id, source_path, content_hash, chunk_ordinal]
      properties:
        chunk_id:
          type: string
        source_id:
          type: string
        source_path:
          type: string
          description: The logical path the document was stored under - which document answered.
        content_hash:
          type: string
          description: The document's content hash, which proves which bytes it held when indexed.
        chunk_ordinal:
          type: integer
          format: int32

    ProvenanceEnvelope:
      type: object
      required: [index_version, ledger_watermark, sources]
      properties:
        index_version:
          type: string
          description: The immutable index version the answer came from.
        ledger_watermark:
          type: integer
          format: int64
          description: The ledger position the index reflects.
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceReference"

    RetrievedChunk:
      type: object
      required: [source, score, text]
      properties:
        source:
          $ref: "#/components/schemas/SourceReference"
        score:
          type: number
          format: double
        text:
          type: string

    SearchQuery:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: The question, which drives the lexical leg.
        top_k:
          type: integer
          format: int32
          default: 10

    SearchResult:
      type: object
      required: [chunks, envelope]
      properties:
        chunks:
          type: array
          items:
            $ref: "#/components/schemas/RetrievedChunk"
        envelope:
          $ref: "#/components/schemas/ProvenanceEnvelope"

    Shape:
      type: object
      required: [name, version, identity, schema]
      properties:
        name:
          type: string
        version:
          type: integer
          format: int32
        identity:
          type: array
          description: The body keys that identify a claim lineage.
          items:
            type: string
        schema:
          type: string
          description: The JSON Schema a fact body must satisfy, JSON-encoded.

    ShapeList:
      type: object
      required: [shapes]
      properties:
        shapes:
          type: array
          items:
            $ref: "#/components/schemas/Shape"

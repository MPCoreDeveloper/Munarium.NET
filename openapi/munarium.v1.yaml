# The Munarium wire contract, v1.
#
# This file is the source of truth for BOTH transports. The JSON/HTTP surface implements it
# directly; the gRPC/protobuf surface is generated from it by SharpPortico, so the two cannot
# drift on names, shapes or enum values. Both are thin adapters over one operation surface
# (Munarium.Wire.MunariumOperations).
#
# Discipline: additive only within v1 - new fields, new operations, new enum values after
# "unspecified". A breaking change becomes v2 and is served side by side.
#
# Declared as OpenAPI 3.0.3 rather than 3.1: the generator now accepts a 3.1 document (it declares it
# 3.0 before parsing, because the bundled Microsoft.OpenApi 1.6.x refuses 3.1, and reports SP1002 to say
# so), but nothing in this contract needs a 3.1-only keyword and 3.0.3 is what every tool reads.
#
# Naming rules this contract has to respect, learned the hard way against SharpPortico 0.3.0-rc.1:
#   * a schema must not share a name with an operation's derived messages, because the generator
#     emits both "{OperationId}Request"/"Response" and the schema - and the generated file then
#     defines the type twice. That is why the search body is SearchQuery/SearchResult while the
#     operation is Search, and why the version creation body is VersionRequest while the operation
#     is CreateVersion.
#   * a schema must not have a property whose PascalCase name equals the schema name, because the
#     generated property and its enclosing class would collide (CS0542). That is why the head of a
#     version is the VersionHead schema, not Head.
openapi: 3.0.3
info:
  title: Munarium
  version: "1.0.0"
  description: |
    Munarium is a fact ledger with governance in the write path: a claim is judged before it is
    written, and a refused claim is recorded as disputed rather than dropped. Claims belong to a
    version, and a version is a node in a lineage, so an answer can always say which memory it came
    from. Reads are pinned with as_of, so what a pin saw stays what it saw, and a composed context
    is a pure function of a pin rather than a guess.
servers:
  - url: /
tags:
  - name: kernel
    description: Liveness and identity.
  - name: versions
    description: Memory versions and the lineage they form.
  - name: ledger
    description: The append-only fact ledger.
  - name: context
    description: Composing what a model would be given.
  - name: retrieval
    description: Evidence retrieval with provenance.
  - name: ingest
    description: Documents in, and where they went.
  - name: shapes
    description: What a claim is allowed to look like.

paths:
  /healthz:
    get:
      operationId: GetHealth
      tags: [kernel]
      summary: Liveness.
      responses:
        "200":
          description: The server is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /v1/versions:
    post:
      operationId: CreateVersion
      tags: [versions]
      summary: Create a version, which is itself a governed claim.
      description: |
        A version is not a table: it is a claim under the "version" shape, so it is judged by the
        same gates, pinned by the same feed and rebuilt from the same slice as every other fact.
        That makes a version id immutable by construction - claiming an existing id conflicts with
        the fact that already holds that lineage. Leave version_id empty to have one generated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRequest"
      responses:
        "200":
          description: The version that was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          description: The version could not be understood, or its parent does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The version's own claim was refused by a gate; the refusal is in the ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/versions/{version_id}/head:
    get:
      operationId: GetHead
      tags: [ledger]
      summary: The current head of a version.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version to read.
          schema:
            type: string
      responses:
        "200":
          description: The head of the version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionHead"

  /v1/versions/{version_id}/lineage:
    get:
      operationId: GetLineage
      tags: [versions]
      summary: The path from a lineage root down to a version, inclusive.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version to read the lineage of.
          schema:
            type: string
      responses:
        "200":
          description: The lineage, root first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionLineage"
        "404":
          description: No such version at the present pin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/versions/{version_id}/claims:
    post:
      operationId: ProposeClaim
      tags: [ledger]
      summary: Propose a claim, which governance then judges.
      description: |
        The model proposes and the mesh disposes: the claim runs the gates before it is written.
        A permitted claim is recorded as accepted, a refused one as disputed - the refusal is
        evidence in the ledger, not a lost write.

        claim_type says what the claim does to whatever the ledger already holds on the same
        lineage. "fact" (and leaving it out) asserts a value the ledger should not already hold, so
        a lineage that already carries one makes it a ledger conflict; "update" and "correction"
        both say why they are superseding, so they are allowed. That is what keeps "the value
        changed" and "the earlier value was wrong" distinguishable instead of one silent overwrite.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version to write to.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimProposal"
      responses:
        "200":
          description: The claim as recorded, with the verdict it was recorded under.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimOutcome"
        "400":
          description: The proposal is missing something the contract requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Every retry lost to a moving head. Retryable, never data loss.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/versions/{version_id}/claim-batches:
    post:
      operationId: ProposeClaimBatch
      tags: [ledger]
      summary: Propose a batch of claims, judged as one unit and landed as one append.
      description: |
        The candidate plane: everything a writer produced for a scope at once, judged against the head the
        gates read and landed as one conditional append. A blocked claim is recorded as disputed rather
        than dropped, so a batch is not a transaction that can half-succeed - it lands entirely or not at
        all, and the findings that judged it travel with it.

        The findings are the authoritative carrier of the verdict: the ledger keeps the rule that refused a
        claim, and the detail - which claim key, which values disagreed - belongs to the finding.

        These claims are semantic: subject.key=value, the vocabulary the gates reason over, with the claim
        type saying what the write does to what is already on the key. expected_head is a caller's pin: a
        batch that names one is answered with a contention instead of a re-gate, because it asked for a
        position rather than for an append.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version to write to.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimBatchRequest"
      responses:
        "200":
          description: The batch as recorded, with the verdicts it was recorded under.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimBatchOutcome"
        "400":
          description: A claim in the batch is missing something the contract requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The caller's pin was not the head, or every retry lost to a moving head.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/versions/{version_id}/findings:
    get:
      operationId: ListFindings
      tags: [ledger]
      summary: The findings a version's writes produced, oldest first.
      description: |
        A finding is the record of a verdict, so this is how a caller asks what governance decided and why -
        including the warnings that refused nothing. The position a finding carries is the write it belongs
        to, which is what makes it citable: a pin taken at that position still sees it.

        The findings live in the version's own stream, recorded in the same append as the claims they judged,
        so they are read under the same pin as those claims rather than from a second store that could be
        out of step with them.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version whose stream is read.
          schema:
            type: string
        - name: as_of
          in: query
          required: false
          description: |-
            The position to read as of, in the version's own stream - the head a write settled at - or 0 for
            every finding recorded. This is deliberately not the global feed position a facts read is pinned
            on: a finding is stamped with the write it belongs to, inside the version it belongs to.
          schema:
            type: integer
            format: int64
        - name: severity
          in: query
          required: false
          description: |-
            The severity to select - "info", "warn" or "block" - or empty for every severity.
          schema:
            type: string
        - name: rule_id
          in: query
          required: false
          description: The exact rule id to select, such as "gate.ledger-conflict", or empty.
          schema:
            type: string
        - name: rule_prefix
          in: query
          required: false
          description: |-
            A rule-id prefix to select - "gate." for the kernel's gates - or empty. It combines with rule_id
            by AND, which is only useful when both are set consistently.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: How many findings to return, oldest first, or 0 for all of them.
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: The findings, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingList"

  /v1/versions/{version_id}/anchors:
    post:
      operationId: LockAnchor
      tags: [command]
      summary: Lock a detail, so no claim may contradict it.
      description: |
        A lock asserts nothing and forbids one thing: that the locked value changes. That is why it is a command
        and not a claim - a claim is judged, a lock is a decision - and why a claim that contradicts a lock is
        reported as an anchor finding rather than as a ledger conflict.

        Locking a detail that is already locked replaces the earlier lock: the anchors plane is keyed by detail and
        the later event wins, so a re-lock is a deliberate restatement. The position in the answer is the position
        the write settled at inside the version's stream; a read of the plane reports the global position a pin is
        on.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version the lock is taken in.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnchorLock"
      responses:
        "200":
          description: The lock as recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Anchor"
        "400":
          description: The request is missing something the contract requires, or names no property to lock.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Every retry lost to a moving head. Retryable, never data loss.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: ListAnchors
      tags: [query]
      summary: The locked details as they stand at a pin.
      description: |
        Later version wins and released locks are absent: the plane is a state and not a log, which is what a gate
        can be judged against without second-guessing an entry.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version whose locked details are read.
          schema:
            type: string
        - name: as_of
          in: query
          required: false
          description: The position to read as of, or 0 for the present.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The locked anchors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnchorList"

  /v1/versions/{version_id}/anchors/{detail_key}/release:
    post:
      operationId: ReleaseAnchor
      tags: [command]
      summary: Release a lock, if there is one.
      description: |
        A release of a detail nobody locked is not a write: it would change nothing and still look like a command
        that did, so the answer says whether anything was released rather than pretending.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version the release is recorded in.
          schema:
            type: string
        - name: detail_key
          in: path
          required: true
          description: The locked detail, as "subject.key".
          schema:
            type: string
        - name: idempotency_key
          in: query
          required: false
          description: |-
            The key this command is made under, or empty for no key. A ULID. This route carries no body, so the key
            travels as a parameter here rather than in a request that has nothing else to carry - the one place the
            contract puts it outside the body, and for that reason.
          schema:
            type: string
      responses:
        "200":
          description: Whether a lock was released.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnchorRelease"
        "400":
          description: The detail key names no property, so it cannot have been locked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Every retry lost to a moving head. Retryable, never data loss.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/versions/{version_id}/promises:
    post:
      operationId: OpenPromise
      tags: [command]
      summary: Register a promise one scope owes to another.
      description: |
        A promise is the mesh's own commitment, so it is recorded rather than judged: no gate refuses one, while
        the promise check reports one that is still open when its due scope is reached. Registering a key that is
        already registered restates it, because the plane is keyed by the coordination key.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version the promise is made in.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromiseRegistration"
      responses:
        "200":
          description: The promise as recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Promise"
        "400":
          description: The request is missing something the contract requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Every retry lost to a moving head. Retryable, never data loss.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: ListPromises
      tags: [query]
      summary: The promises as they stand at a pin.
      description: |
        The plane holds what was recorded, so a promise is open or fulfilled here - expiry and violation are
        judgements the promise check makes, not states the ledger stores. A fulfilment recorded after the pin reads
        back open, because a report over a past date must not use answers from the future.

        Asking for the overdue view computes the promise check's findings over the FULL pinned slice, before any
        status filter narrows it: a finding a filter could hide would be a finding nobody sees.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version whose promises are read.
          schema:
            type: string
        - name: as_of
          in: query
          required: false
          description: The position to read as of, or 0 for the present.
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          description: |-
            The status to select - "open" or "fulfilled" - or empty for every status.
          schema:
            type: string
        - name: overdue_scope
          in: query
          required: false
          description: |-
            Compute the promise check's findings for open promises due at this scope, or empty to skip it.
          schema:
            type: string
        - name: final
          in: query
          required: false
          description: Treat this read as the final unit, where every open promise is overdue.
          schema:
            type: boolean
      responses:
        "200":
          description: The promises, and the overdue findings when they were asked for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromiseList"

  /v1/versions/{version_id}/promises/{key}/fulfill:
    post:
      operationId: FulfillPromise
      tags: [command]
      summary: Fulfil the first open promise with a key.
      description: |
        Only an open promise is fulfilled, and only the first: fulfilling one that is already settled would record
        a settled obligation as settled again. A key with nothing open is answered with "not fulfilled" rather than
        an error, because the caller is told what happened instead of being punished for asking.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version the promise is fulfilled in.
          schema:
            type: string
        - name: key
          in: path
          required: true
          description: The promise's coordination key.
          schema:
            type: string
        - name: idempotency_key
          in: query
          required: false
          description: |-
            The key this command is made under, or empty for no key. A ULID. This route carries no body, so the key
            travels as a parameter here rather than in a request that has nothing else to carry - the one place the
            contract puts it outside the body, and for that reason.
          schema:
            type: string
      responses:
        "200":
          description: Whether a promise was fulfilled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromiseFulfilment"
        "409":
          description: Every retry lost to a moving head. Retryable, never data loss.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/versions/{version_id}/counters:
    post:
      operationId: RecordCounter
      tags: [command]
      summary: Record a whole-document total for a counter.
      description: |
        A counter is an absolute total about the whole document rather than a delta, so recording one is an upsert: a
        reader must not have to sum a stream to know how often a pattern was used, because a budget checked against a
        sum changes meaning when an event is lost. A writer that records a lower total is therefore correcting the
        count - and the plane cannot tell a correction from an evasion, because a counter never sees the text it
        counts.

        The answer carries the total and whether it is over its budget, because the point of keeping a count is to
        tell the writer where it stands and not only that it overspent.

        No scope is recorded: the original sums per-scope counts into a key, which is the model this contract
        deliberately does not use.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version the count belongs to.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CounterRecording"
      responses:
        "200":
          description: The counter as recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Counter"
        "400":
          description: The request is missing a key, or counts something negative.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Every retry lost to a moving head. Retryable, never data loss.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: ListCounters
      tags: [query]
      summary: The counters at a pin, with the directives a writer would be given.
      description: |
        A budget the writer is not told about is only a way to fail it, so the directives travel with the totals: one
        usage line per budgeted counter, and an instruction not to use a pattern whose budget is exhausted. A counter
        with no budget has no line, because there is nothing to tell a writer about it.
      parameters:
        - name: version_id
          in: path
          required: true
          description: The version whose counters are read.
          schema:
            type: string
        - name: as_of
          in: query
          required: false
          description: The position to read as of, or 0 for the present.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The counters, and the directives that follow from them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CounterList"

  /v1/snapshots:
    get:
      operationId: LoadSnapshot
      tags: [ledger]
      summary: Everything the mesh holds at one pin, across every plane.
      description: |
        The audit read: one pin bounds facts, anchors, digests, promises, counters and entities at once, so a
        caller can see what the mesh believed at that position and hand the answer to someone else to check.

        Facts arrive resolved-current at the pin rather than as the writes that produced them; the scope filter
        and the fact limit are applied after that resolution, which is the only order that answers "the newest
        two facts of this scope" - filtering first would let a superseded fact occupy a slot and the reader
        would get fewer current facts than it asked for. The digest ladder is rebuilt from the pinned facts,
        because stored digest text has no history to read at a pin.

        "written_at" is derived from the identities the snapshot holds rather than read from a clock, so a
        verdict or a composition that depends on it can be rebuilt by anyone holding this answer.
      parameters:
        - name: version_id
          in: query
          required: false
          description: The version to read, or empty for every version.
          schema:
            type: string
        - name: as_of
          in: query
          required: false
          description: The position to read as of, or 0 for the present.
          schema:
            type: integer
            format: int64
        - name: scope
          in: query
          required: false
          description: A scope prefix to read, or empty for every scope.
          schema:
            type: string
        - name: fact_limit
          in: query
          required: false
          description: How many facts to keep, counting from the newest, or 0 for all of them.
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: The snapshot at that pin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"

  /v1/facts:
    get:
      operationId: SliceFacts
      tags: [ledger]
      summary: The facts that were current at a pin.
      description: |
        The slice is rebuilt from the ledger at the pin, never served from a cache, so the same
        pin rebuilds the same facts and therefore the same digest. Facts come back ordered by
        lineage, and each one names the version it was written to, so one version can be read out
        of the whole. The digest covers exactly the facts returned.
      parameters:
        - name: as_of
          in: query
          required: false
          description: The global position to read as of. 0 means the head.
          schema:
            type: integer
            format: int64
            default: 0
        - name: version_id
          in: query
          required: false
          description: Read one version instead of every version. Empty means every version.
          schema:
            type: string
            default: ""
      responses:
        "200":
          description: The slice and its digest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactSlice"

  /v1/context:
    post:
      operationId: ComposeContext
      tags: [context]
      summary: Compose the context a model would be given.
      description: |
        Composition is a pure function of the pinned facts, so the same pin composes the same text
        and the same content_hash - which makes the hash a cache key rather than a guess. Sections
        carry the accepted facts within the budget, and refused claims are listed separately under
        "Disputed", because a context that hid what the ledger refused would hide the one thing
        this system exists to keep visible.

        as_of_date resolves to a pin through the versions: the latest version whose as_of date is
        on or before it, and the global position that version was created at. as_of_date wins over
        as_of when both are given.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextRequest"
      responses:
        "200":
          description: The composed context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposedContext"
        "400":
          description: The request could not be understood.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No version reaches back as far as the given as_of_date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/search:
    post:
      operationId: Search
      tags: [retrieval]
      summary: Retrieve evidence for a question.
      description: |
        Returns evidence rather than bare similarity: every answer carries the provenance
        envelope naming which sources answered, which bytes they held when indexed, and which
        ledger position the index reflects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchQuery"
      responses:
        "200":
          description: The retrieved chunks and the envelope that seals them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"

  /v1/shapes:
    get:
      operationId: ListShapes
      tags: [shapes]
      summary: The shapes this deployment understands.
      responses:
        "200":
          description: The registered shapes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShapeList"

  /v1/sources:
    put:
      operationId: IngestSource
      tags: [ingest]
      summary: Ingest a document, and index what it says.
      description: |
        A source's identity is its logical path and not its content hash, so a re-ingest of one path is a new version
        of one source rather than a second source: the row is replaced, and the index identity - which pairs a source
        with its hash - notices that the bytes moved.

        The order is the contract. The media type is checked first, so a document this port cannot read leaves nothing
        behind; a declared hash is verified before the write, so a mismatch costs nothing; and nothing is indexed
        before the row exists, so every citation resolves to a path and a hash. An ingest that changes nothing writes
        nothing and embeds nothing, because a document indexed twice would answer twice and displace other documents by
        existing.

        The document travels either as its text (content) or as its bytes (content_base64), and exactly one of the two
        is present. Bytes are what a binary document needs, and this port reads both binaries upstream reads: a DOCX
        out of its own XML, and a PDF's text layer through a pure managed parser, so neither needs a model, a native
        library or a rasterizer. A scan has no text layer, so it is stored and indexes nothing rather than being
        indexed as bytes no query can find - OCR is the capability this port has not ported. A deployment that has to
        stream a large document puts an object store behind the source seam and hands over its location, which is what
        that seam is for.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceIngest"
      responses:
        "200":
          description: The document as stored, and how much of it reached the index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestedSource"
        "400":
          description: The request names no path, or a path a source may not hold.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: No extractor reads that media type, so nothing was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: What arrived is not what the caller declared, so nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

    get:
      operationId: ListSources
      tags: [ingest]
      summary: The sources this deployment holds.
      description: |
        Source metadata, never the bytes: which paths exist, which bytes each holds now and where they went. An empty
        prefix selects everything - a collection binds its sources by prefix, and reading what a prefix covers is how an
        operator checks the binding before building over it.
      parameters:
        - name: path_prefix
          in: query
          required: false
          description: The path prefix to select, or empty for every source.
          schema:
            type: string
      responses:
        "200":
          description: The source rows, in path order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceList"

  /v1/sources/{source_id}:
    get:
      operationId: GetSource
      tags: [ingest]
      summary: Where a document actually went.
      description: |
        Source metadata, and never the bytes. A row answers which path, which hash, which media type and which backend,
        so an operator can tell whether a document landed and where without the answer ever carrying the document.
      parameters:
        - name: source_id
          in: path
          required: true
          description: The source's identity, as "src-...".
          schema:
            type: string
      responses:
        "200":
          description: The source's metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceInfo"
        "404":
          description: No source with that identity was ingested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/authoring/drafts:
    post:
      operationId: CreateAuthoringDraft
      tags: [authoring]
      summary: Open a draft.
      description: |
        A draft is a name and, optionally, the pattern to start from. The name is also the runbook name it will
        materialize into, so a name that could not be one is refused here rather than at the end. Opening a draft that
        already exists answers with it as it stands rather than replacing it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthoringDraftRequest"
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringDraft"
        "400":
          description: The name could not be a runbook name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: This deployment does not serve that pattern.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: ListAuthoringDrafts
      tags: [authoring]
      summary: The drafts this deployment keeps.
      responses:
        "200":
          description: The drafts, most recently written first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringDraftList"

  /v1/authoring/drafts/{draft_id}:
    delete:
      operationId: DeleteAuthoringDraft
      tags: [authoring]
      summary: Remove a draft.
      description: |
        What an author does once the runbook is applied: the document is the authority and the conversation is spent. A
        name that is not kept here is refused rather than answered as though it had been removed, because a caller that
        believes it removed something that never existed has a wrong idea about what this deployment holds.
      parameters:
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
          description: The draft name.
      responses:
        "200":
          description: The draft that was removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringDraftRemoved"
        "404":
          description: No draft by that name is kept here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

    get:
      operationId: GetAuthoringDraft
      tags: [authoring]
      summary: One draft, with the questions its pattern asks and what is still open.
      parameters:
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
          description: The draft name.
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringDraft"
        "404":
          description: No draft by that name is kept here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/authoring/drafts/{draft_id}/apply:
    post:
      operationId: ApplyAuthoringDraft
      tags: [authoring]
      summary: Apply what a draft materializes, to this deployment.
      description: |
        Shapes first, then the runbook that binds them: a collection binding a shape this deployment does not serve would
        materialize nothing, so the shape lands before the document that names it. The set is validated here as well as
        by the validation operation and refused on an error finding, because an author who validated yesterday and
        answered a question today would otherwise apply something nobody checked.
      parameters:
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
          description: The draft name.
      responses:
        "200":
          description: What landed, in the order it landed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringDraftApplied"
        "404":
          description: No draft by that name is kept here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The draft does not validate, or its shape cannot be published here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/authoring/drafts/{draft_id}/export:
    post:
      operationId: ExportAuthoringDraft
      tags: [authoring]
      summary: Export what a draft materializes as a hash-manifested bundle.
      description: |
        The documents verbatim, a digest for each, the order they have to be applied in, and a digest over the manifest,
        so drift between an export and an apply is detectable anywhere with nothing but a sha256 implementation. Refused
        while an error finding exists: a bundle is what an author hands to an operator, and handing over something a
        deployment would refuse is handing over a refusal.
      parameters:
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
          description: The draft name.
      responses:
        "200":
          description: The bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringBundle"
        "404":
          description: No draft by that name is kept here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The draft does not validate, so there is nothing to hand over.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/authoring/drafts/{draft_id}/assist:
    post:
      operationId: AssistAuthoringDraft
      tags: [authoring]
      summary: Ask a model what it would change about a draft.
      description: |
        Assist suggests and never edits: this deployment keeps a draft as answers and derives its documents from them,
        which is what keeps a draft from disagreeing with itself. A deployment with no model bound, or one whose model
        fails, answers with a note and a 200 - an author asking for help must not be told their draft became invalid.
      parameters:
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
          description: The draft name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistDraftRequest"
      responses:
        "200":
          description: What the assist suggests, and why not when it suggests nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringDraftAssist"
        "404":
          description: No draft by that name is kept here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The draft could not be built at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/authoring/drafts/{draft_id}/validate:
    post:
      operationId: ValidateAuthoringDraft
      tags: [authoring]
      summary: Validate what a draft would apply, without applying it.
      description: |
        The findings a deployment would refuse to apply on, read before anything is applied. Findings rather than
        refusals: an author editing a runbook wants the whole list, and a document with one questionable number in it is
        still a document they may be about to fix.
      parameters:
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
          description: The draft name.
      responses:
        "200":
          description: The findings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringDraftValidation"
        "404":
          description: No draft by that name is kept here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The draft could not be built at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/authoring/drafts/{draft_id}/answers:
    put:
      operationId: PutAuthoringDraftAnswers
      tags: [authoring]
      summary: Replace a draft answers.
      description: |
        A replacement rather than a merge, because that is what a PUT is: an answer an author removes has to disappear,
        and a merge would keep it alive forever.
      parameters:
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
          description: The draft name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthoringAnswers"
      responses:
        "200":
          description: The draft as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringDraft"
        "404":
          description: No draft by that name is kept here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/authoring/patterns:
    get:
      operationId: ListAuthoringPatterns
      tags: [authoring]
      summary: The application patterns this deployment serves.
      description: |
        The same list the interview offers, so a client that shows the patterns offers exactly what a draft would
        accept. Each pattern names the committed exemplar runbook to start from and whether it carries a completion arm.
      responses:
        "200":
          description: The served patterns, in the catalog own order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringPatternList"

  /v1/authoring/patterns/{id}:
    get:
      operationId: GetAuthoringPattern
      tags: [authoring]
      summary: One application pattern.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The pattern identity.
      responses:
        "200":
          description: The pattern.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringPattern"
        "404":
          description: This deployment does not serve that pattern.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/access-tokens:
    post:
      operationId: IssueAccessToken
      tags: [access]
      summary: Exchange authority for a capability.
      description: |
        The identity provider in front authenticates people; this mints the short-lived, least-privilege capability
        they then carry, and it refuses what cannot be issued. An unnamed subject cannot be audited, a capability with
        no scope can do nothing, and a scope nobody defined is a typo that would otherwise look like authority. The
        lifetime is clamped to a day rather than refused, because a capability that outlives a secret rotation is the
        worse failure of the two.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessTokenRequest"
      responses:
        "200":
          description: The capability, which is returned once and never stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "400":
          description: What was asked for cannot be issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: ListAccessTokens
      tags: [access]
      summary: Read the issuance audit.
      description: |
        Who was given what, and which of those still stand. Never a token: nothing here stores token material, because a
        bearer credential is not stored anywhere. This surface is this port's own - the original names four scopes and has
        no audit route - and it takes the access scope, which says that reading credentials is administrative work rather
        than governance's.
      responses:
        "200":
          description: A tenant's issued capabilities, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenAuditList"
        "401":
          description: No capability was presented, or it does not carry the access scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/access-tokens/{jti}/revoke:
    post:
      operationId: RevokeAccessToken
      tags: [access]
      summary: Withdraw a capability.
      description: |
        The one thing that reaches a credential after it was handed out: nothing stores token material, so a withdrawal
        records the identity instead and verification refuses a capability whose row says it was withdrawn. It is
        idempotent, because an operator acting on a stale list has done nothing new.
      parameters:
        - name: jti
          in: path
          required: true
          schema:
            type: string
          description: The identity of the capability to withdraw.
      responses:
        "200":
          description: The row as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenAudit"
        "401":
          description: No capability was presented, or it does not carry the access scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No capability with that identity was issued by this deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/indexes:
    post:
      operationId: BuildIndexVersion
      tags: [retrieval]
      summary: Build an index version over the sources a collection binds.
      description: |
        A build reads every bound source, cuts it, embeds it and writes it into a version nobody is answering from, so
        the version that is live keeps serving while a rebuild happens. The built version is kept, and activating it
        later is a cutover rather than a second build.

        Nothing is skipped quietly: a bound document whose media type this port cannot read refuses the build and names
        the path, and the half-built version is dropped with it - an index that answered with the documents the build
        got to before it stopped would be worse than no index at all. The ledger position is read rather than asked for,
        because a build reflects the state of the world it was made in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexBuild"
      responses:
        "200":
          description: The version as recorded, live when the build asked for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexVersionState"
        "400":
          description: The request names no collection or no shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Nothing was built - nothing is bound, or a bound document cannot be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

    get:
      operationId: ListIndexVersions
      tags: [retrieval]
      summary: A collection's versions, live and superseded.
      description: |
        What an operator reads before cutting over: the versions a collection can be moved to. A superseded version is
        listed because it is still readable - cutting back to one is a cutover, not a restore - and the list is ordered
        by the ledger position each was built against, latest first, because a version has no creation instant of its
        own. A collection nobody has built for answers with an empty list rather than a problem: this port has no
        collection registry to tell "no such collection" from "no versions yet".
      parameters:
        - name: collection_id
          in: query
          required: true
          description: The collection whose versions are read.
          schema:
            type: string
      responses:
        "200":
          description: The collection's versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexVersionList"

  /v1/indexes/active:
    get:
      operationId: GetActiveIndexVersion
      tags: [retrieval]
      summary: The version a collection answers from.
      parameters:
        - name: collection_id
          in: query
          required: true
          description: The collection whose live version is read.
          schema:
            type: string
      responses:
        "200":
          description: The collection's live version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexVersionState"
        "404":
          description: The collection has no live version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/indexes/{index_version_id}:
    get:
      operationId: GetIndexVersion
      tags: [retrieval]
      summary: An index version, and what it was built from.
      parameters:
        - name: index_version_id
          in: path
          required: true
          description: The version's identity, as "idx-...".
          schema:
            type: string
      responses:
        "200":
          description: The version as it stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexVersionState"
        "404":
          description: No such version is recorded, so nothing can be explained by it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/indexes/{index_version_id}/activate:
    post:
      operationId: ActivateIndexVersion
      tags: [retrieval]
      summary: Cut a collection over to a version it already has.
      description: |
        The process is moved before the record is: a version this process never built cannot serve here, and refusing
        before anything changes leaves the record as it was. A cutover is reversible, and the version that stopped
        serving stays readable - an envelope issued while it was live still resolves.
      parameters:
        - name: index_version_id
          in: path
          required: true
          description: The version to make live.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexActivation"
      responses:
        "200":
          description: The activated version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexVersionState"
        "404":
          description: No such version belongs to that collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The version was not built in this process, so it cannot serve from here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/indexes/resolve:
    post:
      operationId: ResolveEnvelope
      tags: [retrieval]
      summary: Resolve an answer's provenance envelope back to its version.
      description: |
        The read that makes provenance worth carrying: it answers whether the bytes an answer cites were in the version
        it names, which is the part of a citation a mixed-up envelope cannot fake. An index version nobody recorded
        resolves to a failure rather than to an error, because "nobody recorded that" is an answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvelopeQuery"
      responses:
        "200":
          description: What the envelope resolves to, and whether it holds up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResolution"
        "400":
          description: The envelope names no version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/evidence:
    post:
      operationId: SealEvidence
      tags: [evidence]
      summary: Seal an artifact, or take a grant to upload one.
      description: |-
        A manifest is a statement about work the sealer did: it executed this exact statement, against this exact source,
        and got exactly these bytes. Sealing is deliberately absent from every client - an SDK that offered it would
        invite an application to assert provenance it cannot vouch for - and is served here for the producer that actually
        did the work.

        Inline when `bytes_base64` is present and at or under the inline cap; otherwise the response carries a single-use
        grant for `PUT /v1/evidence/{evidence_id}/bytes`. Idempotent by the domain tuple - tenant, logical result, policy
        version and authorization class - rather than by an idempotency key, because the tuple holds across replicas and
        across headers, which is the stronger guarantee for a producer retrying a seal.

        A caller may not seal above itself: every later reader trusts the class a manifest declares, so a principal that
        could seal into a class it does not itself dominate would be minting evidence nobody was ever authorized to
        assert. The identity is the server's to assign, and a caller-supplied one is ignored rather than honoured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceSeal"
      responses:
        "200":
          description: The artifact's identity and state, with a grant when one was issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SealedEvidence"
        "400":
          description: The manifest is not one this contract defines, or it names another tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The caller may not seal into the class the manifest declares.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The bytes are not the ones the manifest declares, so nothing was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The bytes are over the inline cap; take a grant and upload them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/evidence/{evidence_id}/bytes:
    put:
      operationId: PutEvidenceBytes
      tags: [evidence]
      summary: Upload an artifact's bytes under a single-use grant.
      description: |-
        The grant flow's upload step. The bytes are verified against the manifest before the grant is spent, so a corrupt
        upload can be retried: burning a single-use capability on a client-side mistake would turn a recoverable error
        into an unrecoverable one.

        An unknown artifact answers exactly what an invalid grant answers, so a caller without a valid grant learns
        nothing about which identities exist.
      parameters:
        - name: evidence_id
          in: path
          required: true
          description: The identity the seal assigned.
          schema:
            type: string
        - name: grant
          in: query
          required: true
          description: The grant identifier handed back by the seal.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceBytesUpload"
      responses:
        "204":
          description: Stored. The artifact stays pending until it is committed.
        "403":
          description: The grant is unknown, expired, already spent, or for another artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The bytes are not the ones the manifest declares, and the grant was not spent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/evidence/{evidence_id}/commit:
    post:
      operationId: CommitEvidence
      tags: [evidence]
      summary: Commit an uploaded artifact, so it becomes citable.
      description: |-
        This is the moment an artifact becomes citable, so it is the moment "these bytes are that hash" has to be true -
        not the moment an upload happened to return a success. The stored bytes are re-read and both declared facts are
        verified again.

        Only absence is the caller's state to fix: a backend that failed to read is a storage error rather than an
        instruction to upload again.
      parameters:
        - name: evidence_id
          in: path
          required: true
          description: The artifact.
          schema:
            type: string
      responses:
        "200":
          description: Whether this call committed it rather than finding it committed already.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommittedEvidence"
        "403":
          description: The caller does not dominate the artifact's class.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No artifact by that identity in this tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The bytes are missing, or are not the ones the manifest declares.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/evidence/{evidence_id}:
    get:
      operationId: GetEvidenceManifest
      tags: [evidence]
      summary: Resolve a citation to the manifest it names.
      description: |-
        The manifest is a statement about how the rows were produced: kind, source and engine, the contract or semantic
        provider version, the snapshot marker, whether the read was complete or truncated, both hashes, and its retention
        state. Check `completeness` before quoting a total - a truncated result supports "at least", never "exactly".

        A 200 already means committed: a pending artifact answers 409 and a purged one 410, because the metadata survives
        a purge so a citation keeps resolving to what it was rather than to nothing. A session that does not dominate the
        artifact's authorization class is refused, and the refusal says nothing about the artifact: learning "this exists
        and is above you" is itself a disclosure.
      parameters:
        - name: evidence_id
          in: path
          required: true
          description: The artifact a citation names.
          schema:
            type: string
      responses:
        "200":
          description: The manifest, with the identity the server assigned stamped onto it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceManifest"
        "403":
          description: The caller does not dominate the artifact's class.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No artifact by that identity in this tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Sealed, and its bytes were never committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          description: Purged under its retention policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: PurgeEvidence
      tags: [evidence]
      summary: Purge an artifact's bytes now.
      description: |-
        The operator-facing twin of the retention sweep, and the reason a legal hold is a reachable refusal rather than
        dead vocabulary: an artifact under hold refuses deletion here, which is what makes a hold mean anything.

        Retention is an operator's decision, not a participant's: a service that can seal evidence must not be able to
        destroy it. The metadata row survives with its purge instant, so every citation to this artifact keeps resolving -
        as `evidence-expired`, an honest statement about retention, rather than as `not-found`, which would read as though
        the citation had been fabricated. The bytes are deleted before the row is marked, so a crash leaves a row the next
        sweep still sees as due rather than a row reporting itself purged over bytes that are still there.
      parameters:
        - name: evidence_id
          in: path
          required: true
          description: The artifact.
          schema:
            type: string
      responses:
        "200":
          description: Whether this call purged it, rather than finding it purged already.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurgedEvidence"
        "403":
          description: An operator's decision, refused for a participant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No artifact by that identity in this tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: A legal hold is in force, so the bytes may not be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/evidence/{evidence_id}/legal-hold:
    post:
      operationId: SetEvidenceLegalHold
      tags: [evidence]
      summary: Place or lift a legal hold.
      description: |-
        A hold blocks deletion and nothing else. Reads stay governed by the authorization class exactly as before: an
        instruction to preserve evidence that also hid it would be a strange instruction. A hold survives an expiry - an
        artifact past its retention date but under hold is skipped by the sweep indefinitely, which is exactly what a hold
        is for.
      parameters:
        - name: evidence_id
          in: path
          required: true
          description: The artifact.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalHoldRequest"
      responses:
        "204":
          description: The hold was placed or lifted.
        "403":
          description: An operator's decision, refused for a participant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No artifact by that identity in this tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/evidence/{evidence_id}/rows:
    get:
      operationId: GetEvidenceRows
      tags: [evidence]
      summary: Read a bounded window over an artifact's rows.
      description: |-
        The sealed rows themselves, in the order they were sealed, paged and capped. The header row is dropped and the
        column names come from the manifest's schema, because the schema is the contract: a header that disagreed with it
        would be the schema drifting silently.

        Served for the canonical CSV form only. A Parquet artifact is sealed and replayed byte for byte but not decoded
        here - pulling a Parquet reader into the image to paginate rows would be a large dependency for a convenience -
        so its rows are refused by name, and the bytes stay intact either way.

        **This route is JSON-only, as it is in the original**: the gRPC transport answers `unsupported` for it by name
        rather than pretending, the same rule every route without a faithful protobuf form follows. A row keyed by the
        names a manifest declares has no protobuf equivalent that keeps the names, and nothing about a row read wants a
        streaming RPC.
      parameters:
        - name: evidence_id
          in: path
          required: true
          description: The artifact a citation names.
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: The zero-based first row. Defaults to 0.
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          description: How many rows. Defaults to 100 and is capped at 1000.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The page, with the total the artifact holds so a caller knows whether to come back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceRows"
        "400":
          description: The artifact's bytes are not the canonical CSV form, so this server does not decode them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The caller does not dominate the artifact's class.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No artifact by that identity in this tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Sealed, and its bytes were never committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          description: Purged under its retention policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/evidence/{evidence_id}/accesses:
    get:
      operationId: ListEvidenceAccesses
      tags: [evidence]
      summary: Who resolved an artifact, and how it went.
      description: |-
        An operator's question about the deployment rather than a participant's question about the data: a service that
        can seal evidence has no business enumerating who read it. It reports that reads happened - who, what kind, how it
        went, when - and never the rows themselves, because an audit table holding the regulated data it audits would be a
        second copy of the problem the audit exists to describe.
      parameters:
        - name: evidence_id
          in: path
          required: true
          description: The artifact.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: How many resolutions, newest first. Defaults to 100 and is capped at 1000.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The resolutions, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceAccesses"
        "403":
          description: An operator's question, refused for a participant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/runbooks:
    post:
      operationId: ApplyRunbook
      tags: [runbooks]
      summary: Apply a runbook, and pin it as name@version.
      description: |-
        Reading is the reader's job and keeping is the store's, and this is where the two meet. A document that cannot be
        read is never stored, and the refusal carries the reader's own complaint rather than a summary of it, because the
        operator editing YAML wants the line.

        Applying does not require a document to be wise, only readable: the findings are what an operator reads before
        applying, and refusing on a warning about a cutover that will publish without a human would be refusing a runbook
        that runs. A version that was removed is refused rather than resurrected - publish a new version instead - so the
        turns that ran under the removed one keep naming the document they actually ran on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunbookApply"
      responses:
        "200":
          description: The version as applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppliedRunbook"
        "400":
          description: The document could not be read as a runbook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: That version was removed; publish a new version instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

    get:
      operationId: ListRunbooks
      tags: [runbooks]
      summary: The runbook versions this deployment has applied.
      description: |-
        One row per version, because the reference is name@version: an earlier version keeps answering after a newer one
        lands, since a session pins one and the turns that ran under it name it. A removed version is hidden unless the
        caller asks for it, and then it is listed with its status - removal is visibility, not deletion.
      parameters:
        - name: include_removed
          in: query
          required: false
          description: Whether removed versions are listed.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The applied versions, in name and then version order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunbookList"


  /v1/sessions/{session_id}:
    get:
      parameters:
        - name: session_id
          in: path
          required: true
          description: The session's identity.
          schema:
            type: string
      operationId: GetSession
      tags: [sessions]
      summary: A session, and every turn it recorded.
      description: |-
        The transcript, with the payloads as they were recorded: the merged hits, the per-collection provenance, the
        completion audit and the hierarchy decision - the last of which is on the turn rather than inside the audit,
        because the audit capture is capped and exactly the large layered turns whose bodies get summarized away are the
        ones whose decision has to survive somewhere else.
      responses:
        "200":
          description: The session and its turns, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "404":
          description: No such session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/sessions/{session_id}/close:
    post:
      parameters:
        - name: session_id
          in: path
          required: true
          description: The session's identity.
          schema:
            type: string
      operationId: CloseSession
      tags: [sessions]
      summary: Close a session.
      description: |-
        Closing is one-way, so this reports whether it happened rather than performing it silently twice: a replayed
        close is visible instead of being indistinguishable from a first one. A closed session takes no further turns,
        and its transcript stays readable - the clearance it snapshotted is still on the row, which is what the earlier
        turns were answered under.
      responses:
        "200":
          description: The session as closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionClosed"
        "404":
          description: No such session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


  /v1/runbooks/{name}/sessions:
    post:
      parameters:
        - name: name
          in: path
          required: true
          description: The runbook's name, or its reference.
          schema:
            type: string
      operationId: CreateSession
      tags: [sessions]
      summary: Open a session over a runbook.
      description: |-
        A session is a conversation with a memory of what it may see. It pins the runbook by name@version, so the next
        version of a document cannot silently change what an open conversation searches, and it snapshots the clearance it
        was opened with, so a token that changes or a runbook that is upgraded mid conversation never alters what the
        turns in flight can read.

        Opening refuses twice, and the second refusal is the interesting one: a clearance that does not name the runbook
        is refused by name, and a clearance that covers the runbook but none of its collections is refused rather than
        opened empty - an empty session would answer every question with a confident nothing, and the caller could not
        tell that apart from an empty corpus. The permitted list is the least-privilege echo the client gets back, and
        it is the same list the rule is measured by.
      responses:
        "200":
          description: The session's identity, the version it pinned, and what it may read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
        "400":
          description: No runbook by that name has been applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The clearance does not cover the runbook, or none of its collections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          description: That version was removed, so it opens no sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/sessions/{session_id}/turns:
    post:
      parameters:
        - name: session_id
          in: path
          required: true
          description: The session's identity.
          schema:
            type: string
      operationId: RunTurn
      tags: [sessions]
      summary: Ask a session a question.
      description: |-
        The order is the design. The session is closed or open, and a closed one is refused before anything is read. Then
        the intent, because the plan a turn runs under is a function of the question. Then the evidence, and only then a
        model - a required layer that cannot answer stops the turn before a completion is paid for. Then the turn is
        recorded, decision included, so "why did the model see this?" is answerable for every turn rather than only for
        the ones small enough to keep.

        `complete` runs the runbook's completion step when it declares one, and a deployment with no completion model
        configured answers 503 rather than pretending: the request is well formed, the deployment is not equipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TurnRequest"
      responses:
        "200":
          description: What the turn produced, and what it cost.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnResponse"
        "400":
          description: The question is empty, or the request names a profile nobody declared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The session is no longer open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: A required layer could not answer, or no completion model is configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/sessions/{session_id}/turns/stream:
    post:
      parameters:
        - name: session_id
          in: path
          required: true
          description: The session's identity.
          schema:
            type: string
      operationId: StreamTurn
      tags: [sessions]
      summary: Ask a session a question, and watch the turn run.
      description: |-
        The same turn as `POST .../turns`, streamed while it runs: `progress` events, then exactly one terminal `done`
        carrying what the unary route would have answered, or `error` carrying the problem body. Nothing is synthesized -
        an event marks a stage boundary the turn actually crossed, so a stream with no `verify` event is the stream of a
        turn that ran no check rather than one whose checks were dropped from the report.

        A failure before the stream starts is answered exactly as the unary route answers it; a failure after it starts
        arrives as the terminal `error`, because the status line is already sent. The events describe the turn rather
        than produce it: a client that stops reading does not stop the turn, which still runs and still records what it
        was told.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TurnRequest"
      responses:
        "200":
          description: |-
            `text/event-stream`: a `progress` event per stage crossed (TurnProgressEvent), terminated by exactly one
            `done` (TurnResponse) or `error` (Problem).
          # The media type is application/json because the original's own generated contract declares this response that
          # way - its OpenAPI writer cannot express a stream - and mirroring the original is what keeps a client written
          # against either contract able to read both. What the route actually answers is text/event-stream, which is what
          # the summary above says and what the JSON surface sends.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnProgressEvent"
        "400":
          description: The question is empty, or the request names a profile nobody declared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The session is no longer open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: A required layer could not answer, or no completion model is configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


components:
  schemas:
    Problem:
      type: object
      description: A machine-actionable failure, mirroring RFC 9457 problem+json.
      required: [type, detail]
      properties:
        type:
          type: string
          description: A stable problem identifier, for example "https://munarium.dev/problems/contended-write".
        detail:
          type: string
        status:
          type: integer
          format: int32
        expected_head:
          type: integer
          format: int64
        actual_head:
          type: integer
          format: int64

    Health:
      type: object
      required: [status, contract]
      properties:
        status:
          type: string
          description: Always "ok" - a health check that answers at all is healthy.
        contract:
          type: string
          description: The wire contract version this server speaks, "mmp.v1".

    VersionHead:
      type: object
      required: [version_id, head]
      properties:
        version_id:
          type: string
        head:
          type: integer
          format: int64
          description: The last sequence number in the version. 0 means nothing has been written.

    Version:
      type: object
      required: [version_id, head]
      properties:
        version_id:
          type: string
          description: The version's identity, which is also the stream its claims are written to.
        parent_version_id:
          type: string
          description: The version it descends from. Empty when it starts a lineage.
        as_of_date:
          type: string
          description: The date this version is "as of", as YYYY-MM-DD. Empty when it declares none.
        label:
          type: string
          description: A label for humans.
        head:
          type: integer
          format: int64
          description: The version's own head.

    VersionLineage:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          description: The lineage from its root down to the requested version, inclusive.
          items:
            $ref: "#/components/schemas/Version"

    VersionRequest:
      type: object
      required: [actor]
      properties:
        version_id:
          type: string
          description: |
            The identity to use, or empty to have the server generate one. Identities are ULIDs, so
            a generated one sorts by creation time.
        parent_version_id:
          type: string
          description: The version to descend from, or empty for a lineage root.
        as_of_date:
          type: string
          description: The date this version is "as of", as YYYY-MM-DD, or empty.
        label:
          type: string
          description: A label for humans, or empty.
        actor:
          type: string
          description: Who is creating it.
        idempotency_key:
          type: string
          description: |-
            The key this command is made under, or empty for no key. A ULID; the same key on this operation is
            answered with what the first attempt was answered, and writes nothing a second time.

    ClaimStatus:
      type: string
      description: |
        What the ledger recorded. "disputed" is a recorded outcome, not an error: the claim is in
        the ledger with the reason it was refused.
      enum:
        - unspecified
        - accepted
        - disputed
        - contended

    ClaimType:
      type: string
      description: |
        What a claim does to whatever the ledger already holds on its lineage. "unspecified" and
        "fact" both assert a value the ledger should not already hold, so a lineage that already
        carries one refuses them as a ledger conflict; "update" and "correction" say why they are
        superseding, so they are permitted.
      enum:
        - unspecified
        - fact
        - update
        - correction

    Snapshot:
      type: object
      description: |-
        The point-in-time view the gates and the composer read. Every plane shares one sequence axis, which is
        the whole reason a pin can be a single number: a reader that pinned facts and promises separately would
        have to invent a rule for the two pins disagreeing.
      required: [version_id, facts, anchors, digests, promises, counters, entities]
      properties:
        version_id:
          type: string
          description: The version the snapshot was taken of, or empty for every version.
        as_of_sequence:
          type: integer
          format: int64
          description: The position the snapshot was pinned at, or 0 for the present.
        as_of_date:
          type: string
          description: The calendar date it was read as of, or empty.
        written_at:
          type: string
          description: |-
            The instant the newest identity in the snapshot was created at, as RFC 3339, or empty when no
            identity is a ULID. This is not the pin: the pin says which writes are visible, this says when the
            newest visible write happened.
        written_on:
          type: string
          description: That instant as a calendar date, YYYY-MM-DD, or empty - what a chronology rule reads.
        facts:
          type: array
          description: The current facts at the pin, in ascending sequence order.
          items:
            $ref: "#/components/schemas/ResolvedClaim"
        anchors:
          type: array
          description: The locked anchors, later version winning, keyed by detail key.
          items:
            $ref: "#/components/schemas/Anchor"
        digests:
          type: array
          description: The digest ladder as it stands at the pin, rebuilt rather than served.
          items:
            $ref: "#/components/schemas/Digest"
        promises:
          type: array
          items:
            $ref: "#/components/schemas/Promise"
        counters:
          type: array
          items:
            $ref: "#/components/schemas/Counter"
        entities:
          type: array
          items:
            $ref: "#/components/schemas/Entity"

    CounterRecording:
      type: object
      description: A whole-document total, as a writer reports it.
      required: [key, total]
      properties:
        key:
          type: string
          description: The pattern the counter counts.
        total:
          type: integer
          format: int64
          description: |-
            The total as it stands, absolute rather than a delta: the number of times the pattern occurs in the
            document, not how many more times it occurred since the last record.
        budget:
          type: integer
          format: int64
          description: The ceiling the writer is working under, or 0 for none.
        idempotency_key:
          type: string
          description: |-
            The key this command is made under, or empty for no key. A ULID, so a retry of a total that already
            landed is answered with the total that landed rather than with a second one.

    CounterList:
      type: object
      required: [counters]
      properties:
        counters:
          type: array
          description: The counters at the pin.
          items:
            $ref: "#/components/schemas/Counter"
        directives:
          type: string
          description: |-
            One line per budgeted counter, and an instruction for one whose budget is exhausted; empty when no
            counter has a budget. A budget the writer is not told about is only a way to fail it.

    AnchorLock:
      type: object
      description: |-
        A lock, as the caller asks for it. The detail key is derived from subject and key rather than passed whole,
        so a lock always names a property a claim can be matched against.
      required: [subject, key, value]
      properties:
        subject:
          type: string
          description: The thing whose detail is locked.
        key:
          type: string
          description: The property of the subject.
        value:
          type: string
          description: The value the detail is pinned to.
        scope_path:
          type: string
          description: The scope the lock is taken at, or empty.
        evidence:
          type: string
          description: The evidence the lock is taken on, as JSON text, or empty.
        idempotency_key:
          type: string
          description: |-
            The key this command is made under, or empty for no key. A ULID, so a retry with a different value is
            answered with the value that was locked rather than re-locking it.

    PromiseRegistration:
      type: object
      required: [key, kind, description]
      properties:
        key:
          type: string
          description: |-
            The coordination key. It identifies the obligation, so two obligations alive at once need two keys.
        kind:
          type: string
          description: What kind of promise it is.
        description:
          type: string
          description: The promise in words.
        origin_scope:
          type: string
          description: The scope it is made in, or empty.
        due_scope:
          type: string
          description: The scope it is owed to, or empty.
        idempotency_key:
          type: string
          description: |-
            The key this command is made under, or empty for no key. A ULID, so a retry opens one promise rather
            than two.

    AnchorRelease:
      type: object
      required: [released]
      properties:
        released:
          type: boolean
          description: |-
            False when nothing was locked. The answer says so rather than pretending, and nothing was written: a
            release that changed nothing must not look like a command that did.

    PromiseFulfilment:
      type: object
      required: [fulfilled]
      properties:
        fulfilled:
          type: boolean
          description: |-
            False when no promise with that key was open. A settled obligation is not settled twice, and a key with
            nothing open is not an error.

    AnchorList:
      type: object
      required: [anchors]
      properties:
        anchors:
          type: array
          description: The locked details, later version winning and released ones absent.
          items:
            $ref: "#/components/schemas/Anchor"

    PromiseList:
      type: object
      required: [promises]
      properties:
        promises:
          type: array
          description: The promises as they stand at the pin.
          items:
            $ref: "#/components/schemas/Promise"
        findings:
          type: array
          description: |-
            The promise check's overdue findings, when the read asked for them; empty otherwise. They are computed
            over the full pinned slice before any status filter narrows it.
          items:
            $ref: "#/components/schemas/Finding"

    AnchorStatus:
      type: string
      description: Whether a lock still holds. Only a locked anchor is judged against.
      enum:
        - unspecified
        - locked
        - released

    PromiseStatus:
      type: string
      description: What became of a promise, as of the pin.
      enum:
        - unspecified
        - open
        - fulfilled
        - expired
        - violated

    ResolvedClaim:
      type: object
      description: |-
        A claim as the kernel reasons over it: the triple, where it sits in the scope tree, and the provenance
        it was admitted under. The sequence is the position in the ledger as a whole, because that is the axis
        the pin is on.
      required: [claim_id, version_id, sequence, claim_type, subject, key, value, status, provenance]
      properties:
        claim_id:
          type: string
        version_id:
          type: string
        sequence:
          type: integer
          format: int64
        claim_type:
          $ref: "#/components/schemas/ClaimType"
        subject:
          type: string
        key:
          type: string
        value:
          type: string
        scope_path:
          type: string
          description: The dotted scope it was written in, or empty.
        status:
          $ref: "#/components/schemas/ClaimStatus"
        provenance:
          $ref: "#/components/schemas/Provenance"
        supersedes_id:
          type: string
          description: The claim it says it supersedes, or empty.

    Anchor:
      type: object
      description: |-
        A locked detail: while the anchor is locked, the detail key may not drift from the locked value. An
        anchor freezes one detail without freezing the whole subject.
      required: [anchor_id, version_id, detail_key, locked_value, status, sequence]
      properties:
        anchor_id:
          type: string
        version_id:
          type: string
        detail_key:
          type: string
          description: The locked detail, as "subject.key".
        locked_value:
          type: string
        locked_at_scope:
          type: string
          description: The scope the lock was taken at, or empty.
        status:
          $ref: "#/components/schemas/AnchorStatus"
        sequence:
          type: integer
          format: int64
        evidence:
          type: string
          description: The evidence the lock was taken on, as JSON text, or empty.

    Digest:
      type: object
      description: One rung of the digest ladder - a deterministic, model-free compression of facts under a scope.
      required: [version_id, tier, scope_path, content, content_hash, built_from_sequence]
      properties:
        version_id:
          type: string
        tier:
          type: integer
          format: int32
          description: 0 per scope, 1 per scope-prefix group, 2 the whole-lineage rollup.
        scope_path:
          type: string
          description: The scope the rung covers - the group name at tier 1, and empty for the rollup.
        content:
          type: string
        content_hash:
          type: string
          description: The SHA-256 of the content, as lowercase hex.
        built_from_sequence:
          type: integer
          format: int64
          description: The highest ledger position the rung was built from.

    Promise:
      type: object
      description: A promise made in one scope and owed to a later one.
      required: [promise_id, version_id, key, kind, description, status, sequence]
      properties:
        promise_id:
          type: string
        version_id:
          type: string
        key:
          type: string
        kind:
          type: string
        description:
          type: string
        origin_scope:
          type: string
          description: The scope it was made in, or empty.
        due_scope:
          type: string
          description: The scope it is owed to, or empty.
        status:
          $ref: "#/components/schemas/PromiseStatus"
        sequence:
          type: integer
          format: int64
          description: The position the promise was made at.
        fulfilled_sequence:
          type: integer
          format: int64
          description: The position it was fulfilled at, or 0 while it is open.

    Counter:
      type: object
      description: A whole-document frequency, with the ceiling it was declared under when it declared one.
      required: [key, total]
      properties:
        key:
          type: string
        total:
          type: integer
          format: int64
        budget:
          type: integer
          format: int64
          description: The declared ceiling, or 0 when the counter has none.
        over_budget:
          type: boolean
          description: Whether the total has passed the ceiling.

    Entity:
      type: object
      description: A resolved entity, and the aliases it was resolved from.
      required: [entity_id, version_id, canonical_name, sequence]
      properties:
        entity_id:
          type: string
        version_id:
          type: string
        canonical_name:
          type: string
        entity_type:
          type: string
          description: The entity's type, or empty.
        aliases:
          type: array
          items:
            type: string
        sequence:
          type: integer
          format: int64
        merged_into:
          type: string
          description: The entity this one was merged into, or empty.

    FindingList:
      type: object
      required: [findings]
      properties:
        findings:
          type: array
          description: The findings, oldest first.
          items:
            $ref: "#/components/schemas/StoredFinding"

    StoredFinding:
      type: object
      required: [sequence, finding]
      properties:
        sequence:
          type: integer
          format: int64
          description: |-
            The position the write settled at, which every finding of that write shares: the verdict belongs to
            the write and not to the individual rule that produced it.
        finding:
          $ref: "#/components/schemas/Finding"

    ClaimCandidate:
      type: object
      description: |-
        One claim as the candidate plane sees it: a semantic triple rather than a shaped body, because that
        is what the gates reason over. A batch may span scopes, so the scope travels per claim, and the
        candidate's own scope - the one a finding is reported against - is the first one any claim names.
      required: [subject, key, value]
      properties:
        claim_type:
          $ref: "#/components/schemas/ClaimType"
        subject:
          type: string
          description: The thing the claim is about.
        key:
          type: string
          description: The property of the subject.
        value:
          type: string
          description: The asserted value, as text.
        scope_path:
          type: string
          description: The dotted scope the claim was produced in, or empty for none.
        provenance:
          $ref: "#/components/schemas/Provenance"
        supersedes_id:
          type: string
          description: The claim this one says it supersedes, or empty when it names none.

    ClaimBatchRequest:
      type: object
      required: [claims]
      properties:
        claims:
          type: array
          description: The proposals in the batch, in the order they were produced.
          items:
            $ref: "#/components/schemas/ClaimCandidate"
        text:
          type: string
          description: |-
            The text the text-shaped gates read - meta-leakage and repetition judge a unit of text, not a
            claim - or empty when the batch produced none.
        expected_head:
          type: integer
          format: int64
          description: |-
            The head the caller requires, or 0 to append at whatever the head is. A caller that pins one
            gets a contention instead of a re-gate.
        idempotency_key:
          type: string
          description: |-
            The key this command is made under, or empty for no key. A ULID, which a client can mint without a
            round trip and which sorts by the instant it was made. The same key on the same operation and version
            is answered with what the first attempt was answered, and writes nothing a second time; a different
            key, or the same key on another operation or version, is another command.

    Provenance:
      type: string
      description: How a claim came to exist.
      enum:
        - unspecified
        - witnessed
        - backfilled
        - repaired
        - emergent
        - coverage_repair

    Severity:
      type: string
      description: How serious a finding is. Only "block" refuses a claim.
      enum:
        - unspecified
        - info
        - warn
        - block

    Finding:
      type: object
      description: |-
        One thing a gate had to say about a batch. Findings accumulate, because a batch can break several
        rules at once and an operator who fixes one of them should not have to re-run to discover the next.
      required: [rule_id, severity, message]
      properties:
        rule_id:
          type: string
          description: The dotted rule identifier, such as "gate.ledger-conflict".
        severity:
          $ref: "#/components/schemas/Severity"
        message:
          type: string
          description: The finding in the operator's words.
        scope_path:
          type: string
          description: The scope the batch was judged in, or empty.
        claim_key:
          type: string
          description: |-
            The claim this finding disputes, or empty when it names none - a meta-leakage finding is about
            a unit of text and cannot dispute one claim.
        detail:
          type: string
          description: |-
            The structured detail as JSON text. The kernel does not interpret it, so the contract carries it
            verbatim rather than promising a shape it would have to keep in step.

    ClaimBatchOutcome:
      type: object
      required: [version_id, head, claims, findings]
      properties:
        version_id:
          type: string
        head:
          type: integer
          format: int64
          description: The version's head after the append.
        claims:
          type: array
          description: The claims as recorded, in the order they were proposed.
          items:
            $ref: "#/components/schemas/ClaimOutcome"
        findings:
          type: array
          description: Every finding the gates produced, including the warnings that refused nothing.
          items:
            $ref: "#/components/schemas/Finding"
        findings_sequence:
          type: integer
          format: int64
          description: The position the findings were recorded at, or 0 when the write produced none.

    ClaimProposal:
      type: object
      required: [claim_id, shape, body, statement, actor]
      properties:
        claim_id:
          type: string
          description: The claim's identity, unique within the version.
        claim_type:
          $ref: "#/components/schemas/ClaimType"
        shape:
          type: string
          description: |
            The shape this claim is made under. The shape supplies both the schema the body is
            validated against and the identity fields that decide supersession.
        body:
          type: string
          description: The structured fact body, JSON-encoded and validated against the shape.
        statement:
          type: string
          description: The claim in the actor's words.
        actor:
          type: string
          description: Who is asserting it.
        idempotency_key:
          type: string
          description: |-
            The key this command is made under, or empty for no key. A ULID, which a client can mint without a
            round trip and which sorts by the instant it was made. The same key on the same operation and version
            is answered with what the first attempt was answered, and writes nothing a second time.

    ClaimOutcome:
      type: object
      required: [version_id, claim_id, claim_type, lineage, status, head]
      properties:
        version_id:
          type: string
        claim_id:
          type: string
        claim_type:
          $ref: "#/components/schemas/ClaimType"
        lineage:
          type: string
          description: |
            Derived by the kernel from the shape's identity fields over the body, so a caller
            cannot get supersession wrong.
        status:
          $ref: "#/components/schemas/ClaimStatus"
        gate:
          type: string
          description: The gate that refused the claim. Empty when it was accepted.
        reason:
          type: string
        head:
          type: integer
          format: int64
          description: The version's head after the write.

    Fact:
      type: object
      required: [version_id, claim_id, claim_type, lineage, statement, actor, status, sequence]
      properties:
        version_id:
          type: string
          description: The version the fact was written to.
        claim_id:
          type: string
        claim_type:
          $ref: "#/components/schemas/ClaimType"
        lineage:
          type: string
        statement:
          type: string
        actor:
          type: string
        status:
          $ref: "#/components/schemas/ClaimStatus"
        gate:
          type: string
        reason:
          type: string
        sequence:
          type: integer
          format: int64
          description: The global position that made this fact the current one.

    FactSlice:
      type: object
      required: [as_of, digest, facts]
      properties:
        as_of:
          type: integer
          format: int64
          description: The pin this slice was taken at.
        digest:
          type: string
          description: SHA-256 over exactly the facts above, lowercase hex. A later event cannot change it.
        facts:
          type: array
          items:
            $ref: "#/components/schemas/Fact"

    ContextSection:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
        body:
          type: string

    ContextRequest:
      type: object
      properties:
        version_id:
          type: string
          description: Compose one version, or empty for every version.
        shape:
          type: string
          description: Compose one shape, or empty for every shape.
        as_of:
          type: integer
          format: int64
          default: 0
          description: The global position to compose as of. 0 means the present.
        as_of_date:
          type: string
          description: |
            A date, as YYYY-MM-DD, resolved to a pin through the versions. Wins over as_of when both
            are given.
        budget_tokens:
          type: integer
          format: int32
          default: 0
          description: |
            The token budget for facts. 0 means unbounded. The estimate is four characters per
            token, rounded up - deliberately not a tokeniser, because the estimate has to be
            reproducible or the content hash means nothing.
        fact_limit:
          type: integer
          format: int32
          default: 0
          description: How many facts may be included. 0 means unbounded.

    ComposedContext:
      type: object
      required: [sections, text, estimated_tokens, content_hash, as_of]
      properties:
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ContextSection"
        text:
          type: string
          description: The composed text, which is the concatenation of the section bodies.
        estimated_tokens:
          type: integer
          format: int32
          description: The token estimate for the text.
        content_hash:
          type: string
          description: SHA-256 over the text, lowercase hex. The same pin composes the same hash.
        as_of:
          type: integer
          format: int64
          description: The pin it was composed at.

    SourceReference:
      type: object
      required: [chunk_id, source_id, source_path, content_hash, chunk_ordinal]
      properties:
        chunk_id:
          type: string
        source_id:
          type: string
        source_path:
          type: string
          description: The logical path the document was stored under - which document answered.
        content_hash:
          type: string
          description: The document's content hash, which proves which bytes it held when indexed.
        chunk_ordinal:
          type: integer
          format: int32

    ProvenanceEnvelope:
      type: object
      required: [index_version, ledger_watermark, sources]
      properties:
        index_version:
          type: string
          description: The immutable index version the answer came from.
        ledger_watermark:
          type: integer
          format: int64
          description: The ledger position the index reflects.
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceReference"

    RetrievedChunk:
      type: object
      required: [source, score, text]
      properties:
        source:
          $ref: "#/components/schemas/SourceReference"
        score:
          type: number
          format: double
        text:
          type: string

    SearchQuery:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: The question, which drives the lexical leg.
        top_k:
          type: integer
          format: int32
          default: 10

    SearchResult:
      type: object
      required: [chunks, envelope]
      properties:
        chunks:
          type: array
          items:
            $ref: "#/components/schemas/RetrievedChunk"
        envelope:
          $ref: "#/components/schemas/ProvenanceEnvelope"

    Shape:
      type: object
      required: [name, version, identity, schema]
      properties:
        name:
          type: string
        version:
          type: integer
          format: int32
        identity:
          type: array
          description: The body keys that identify a claim lineage.
          items:
            type: string
        schema:
          type: string
          description: The JSON Schema a fact body must satisfy, JSON-encoded.

    ShapeList:
      type: object
      required: [shapes]
      properties:
        shapes:
          type: array
          items:
            $ref: "#/components/schemas/Shape"

    SourceIngest:
      type: object
      required: [path, media_type]
      properties:
        path:
          type: string
          description: |
            The logical path, which is the source's identity: the same bytes at two paths are two sources, and the same
            path with different bytes is one source replaced.
        media_type:
          type: string
          description: The media type of the document, with or without parameters, for example "text/plain; charset=utf-8" or "application/pdf".
        content:
          type: string
          description: |
            The document's text, for a document that is already text. Exactly one of content and content_base64 is
            present; when this one is, a declared hash is taken over its UTF-8 encoding.
        content_base64:
          type: string
          description: |
            The document's bytes as standard base64, for a document that is not text - a DOCX or a PDF. Exactly one of
            content and content_base64 is present; when this one is, a declared hash is taken over the bytes it decodes
            to, which is what makes the declaration checkable against what arrived.
        content_sha256:
          type: string
          description: |
            The hash the caller declares, in the canonical form ("sha256:" and lower-case hex), or empty to have the
            server hash what arrived. A declaration that does not match is refused before anything is written.

    IngestedSource:
      type: object
      required: [source_id, path, kind, content_hash, chunks_indexed, index_version]
      properties:
        source_id:
          type: string
          description: The source's identity, derived from the tenant and the path.
        path:
          type: string
        kind:
          type: string
          description: |
            What the ingest did to the path: "new" when it was not a source before, "replaced" when it held different
            bytes, "unchanged" when it already held exactly these bytes - in which case nothing was written and nothing
            was indexed.
        media_type:
          type: string
        content_hash:
          type: string
          description: The hash of the bytes stored, in the canonical form.
        bytes:
          type: integer
          format: int64
          description: How many bytes of UTF-8 that is.
        blob_uri:
          type: string
          description: Where the bytes went, as the backend resolved it, so an operator is not left guessing.
        backend_id:
          type: string
        ingested_at:
          type: string
          description: When the row was written, as the backend recorded it.
        chunks_indexed:
          type: integer
          format: int32
          description: |
            How many chunks were written into the index. Reported rather than assumed, because a document that is
            stored and not indexed - because it held no text, or because it was already there - is a real state.
        index_version:
          type: string
          description: The index version the chunks were written into, which is what an answer from them will cite.

    SourceInfo:
      type: object
      required: [source_id, path, content_hash]
      properties:
        source_id:
          type: string
        path:
          type: string
        media_type:
          type: string
        content_hash:
          type: string
          description: The hash of the bytes this path holds now, which is not the same question as what it held.
        bytes:
          type: integer
          format: int64
        blob_uri:
          type: string
        backend_id:
          type: string
        extraction_status:
          type: string
          description: |
            NULL until first indexed, then ok | empty | failed. A document that yielded nothing is visible here rather
            than looking like one nobody ingested, which is the original's reason for the field.
        extraction_method:
          type: string
          description: |
            text | docx | pdf-text | ocr - OCR'd text is not equivalent evidence, and a scan and a document whose
            extractor found nothing are different facts.
        ingested_at:
          type: string

    AccessTokenRequest:
      type: object
      required: [subject, level, scopes]
      properties:
        subject:
          type: string
          description: The end-user identity the caller asserts, which must match the uid header on every call made with the token.
        level:
          type: integer
          description: The access level the capability carries.
        compartments:
          type: array
          items:
            type: string
          description: The need-to-know compartments it carries.
        scopes:
          type: array
          items:
            type: string
          description: One or more of query, ingest, findings, evidence and access.
        runbooks:
          type: array
          items:
            type: string
          description: The runbook names permitted, or absent for any the level permits.
        lifetime_seconds:
          type: integer
          format: int64
          description: How long it should live, or 0 for the deployment default.

    AccessToken:
      type: object
      required: [token, token_id, expires_at]
      properties:
        token:
          type: string
          description: The capability itself. Returned once and never stored, because it is a bearer credential.
        token_id:
          type: string
          description: Its identity, which is what a revocation names.
        expires_at:
          type: integer
          format: int64
          description: When it stops being valid, in seconds since the epoch.

    AccessTokenAudit:
      type: object
      required: [token_id, subject, tenant, level, issued_at, expires_at]
      properties:
        token_id:
          type: string
          description: The capability's identity, which is what a withdrawal names.
        subject:
          type: string
        tenant:
          type: string
        level:
          type: integer
        compartments:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        runbooks:
          type: array
          items:
            type: string
          description: The runbooks it permits, absent when it permits any the level allows.
        issued_at:
          type: integer
          format: int64
        expires_at:
          type: integer
          format: int64
        revoked_at:
          type: integer
          format: int64
          description: When it was withdrawn, absent while it stands.

    AuthoringValue:
      type: object
      description: |
        One answer, in whichever of the five shapes an interview asks in: text, a whole number, a flag, a list of answers,
        or a map of answers. Exactly one member is set.
      properties:
        text:
          type: string
        number:
          type: integer
          format: int64
        flag:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringValue"
        fields:
          type: array
          description: One entry per member of a map answer.
          items:
            $ref: "#/components/schemas/AuthoringAnswer"

    AuthoringAnswer:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
          description: The question id this answers.
        value:
          $ref: "#/components/schemas/AuthoringValue"

    AuthoringAnswers:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          description: |
            One entry per answer. A list of pairs rather than a map, because a map of values would be generated as a
            well-known Struct, and a generated client is better served by a type it can name.
          items:
            $ref: "#/components/schemas/AuthoringAnswer"

    AuthoringDraftRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The draft name, which is the runbook name it will materialize into.
        pattern_id:
          type: string
          description: The application pattern to start from, absent while none is chosen.

    AuthoringQuestion:
      type: object
      required: [id, prompt, guidance, kind, required, maps_to]
      properties:
        id:
          type: string
        prompt:
          type: string
        guidance:
          type: string
        kind:
          type: string
          description: string, text, int, bool, enum, areas, fields or map.
        required:
          type: boolean
        default:
          type: string
          description: The default as the text of a JSON value, absent when the question has none.
        choices:
          type: array
          items:
            type: string
        maps_to:
          type: string

    AuthoringDraftSection:
      type: object
      required: [id, title, doc_ref, questions]
      properties:
        id:
          type: string
        title:
          type: string
        doc_ref:
          type: string
        questions:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringQuestion"

    AuthoringDraft:
      type: object
      required: [name, answers, sections, todos]
      properties:
        name:
          type: string
        pattern_id:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        answers:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringAnswer"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringDraftSection"
        todos:
          type: array
          items:
            type: string
          description: What still has to be answered, from the same rules that would materialize the draft.

    AuthoringDraftList:
      type: object
      required: [drafts]
      properties:
        drafts:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringDraft"

    AssistDraftRequest:
      type: object
      properties:
        description:
          type: string
          description: What the author wants, in their own words, when they say.

    Suggestion:
      type: object
      required: [path, note]
      properties:
        path:
          type: string
          description: The document it is about, which the model may leave unnamed.
        note:
          type: string
          description: What to change and why.

    AuthoringDraftAssist:
      type: object
      required: [suggestions, assist_note, validation]
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/Suggestion"
        assist_note:
          type: string
          description: Why there is no help, when there is none.
        validation:
          $ref: "#/components/schemas/AuthoringDraftValidation"

    BundleFile:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
        content:
          type: string
          description: The document verbatim, as it travels.

    BundleDigest:
      type: object
      required: [path, hash]
      properties:
        path:
          type: string
        hash:
          type: string

    BundleTool:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
        version:
          type: string

    BundleValidation:
      type: object
      required: [valid, errors, warns, infos]
      properties:
        valid:
          type: boolean
        errors:
          type: integer
        warns:
          type: integer
        infos:
          type: integer

    AuthoringBundle:
      type: object
      required: [kind, api_version, tool, draft_id, name, created_at, files, hashes, apply_order, manifest_hash, validation]
      properties:
        kind:
          type: string
        api_version:
          type: string
        tool:
          $ref: "#/components/schemas/BundleTool"
        draft_id:
          type: string
        name:
          type: string
        created_at:
          type: string
        files:
          type: array
          description: The documents, as path and content pairs.
          items:
            $ref: "#/components/schemas/BundleFile"
        hashes:
          type: array
          description: Their digests, as path and digest pairs.
          items:
            $ref: "#/components/schemas/BundleDigest"
        apply_order:
          type: array
          items:
            type: string
        manifest_hash:
          type: string
        validation:
          $ref: "#/components/schemas/BundleValidation"

    AppliedDocument:
      type: object
      required: [path, kind, ref, yaml_hash]
      properties:
        path:
          type: string
          description: The path the materialized set carried the document under.
        kind:
          type: string
          description: Shape or Runbook.
        ref:
          type: string
          description: The identity it is served under now.
        yaml_hash:
          type: string
          description: Its content digest, as this port spells digests.

    AuthoringDraftApplied:
      type: object
      required: [applied]
      properties:
        applied:
          type: array
          description: The documents, in the order they landed, shapes first.
          items:
            $ref: "#/components/schemas/AppliedDocument"

    ValidationFinding:
      type: object
      required: [severity, code, message, path]
      properties:
        severity:
          type: string
          description: error, warn or info. An error is what a deployment refuses to apply on.
        code:
          type: string
        message:
          type: string
        path:
          type: string

    AuthoringDraftValidation:
      type: object
      required: [valid, findings, todos]
      properties:
        valid:
          type: boolean
          description: Whether nothing found is an error.
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ValidationFinding"
        todos:
          type: array
          description: What the draft still owes, from the same rules that would materialize it.
          items:
            type: string

    AuthoringDraftRemoved:
      type: object
      required: [name]
      properties:
        name:
          type: string

    AuthoringPattern:
      type: object
      required: [id, name, description, start_from, guidance, has_completion]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        start_from:
          type: string
          description: The key of the committed exemplar runbook this pattern starts from.
        guidance:
          type: string
        shape_names:
          type: array
          items:
            type: string
        has_completion:
          type: boolean
          description: Whether the pattern carries a completion arm, which is what gates the interview completion section.
        decision_notes:
          type: array
          items:
            type: string

    AuthoringPatternList:
      type: object
      required: [patterns]
      properties:
        patterns:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringPattern"

    AccessTokenAuditList:
      type: object
      required: [capabilities]
      properties:
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/AccessTokenAudit"
    IndexManifest:
      type: object
      description: |
        What an index version was built from. Every field is identity material - the embedder, the chunker, the
        extractors and the engine all change what a query would match - so a manifest explains a version rather than
        describing one.
      required: [collection_id, engine, chunker, extractors, embedder, source_content_hashes]
      properties:
        collection_id:
          type: string
        collection_name:
          type: string
        shape_ref:
          type: string
        engine:
          type: string
          description: The retrieval engine that built the vectors, as a versioned reference such as "flat@1".
        chunker:
          type: string
          description: The chunker's version, such as "chunk@1".
        extractors:
          type: string
          description: The extractors' version, such as "text@1".
        embedder:
          type: string
          description: The embedder's fingerprint, as "provider/model@dimensions".
        max_chars:
          type: integer
          format: int32
        source_content_hashes:
          type: array
          description: The hash of every source the version indexed, sorted.
          items:
            type: string

    IndexVersionState:
      type: object
      required: [index_version_id, collection_id, shape_ref, watermark, active, superseded, manifest]
      properties:
        index_version_id:
          type: string
        collection_id:
          type: string
        shape_ref:
          type: string
        watermark:
          type: integer
          format: int64
          description: The ledger position the version was built against, which is where a citation ends.
        active:
          type: boolean
          description: Whether the version is the collection's live one.
        superseded:
          type: boolean
          description: Whether it was once live and is not now. A superseded version stays readable.
        activated_at:
          type: string
          description: When the version first went live.
        deactivated_at:
          type: string
          description: When it stopped being live.
        manifest:
          $ref: "#/components/schemas/IndexManifest"

    IndexBuild:
      type: object
      required: [collection_id, shape_ref]
      properties:
        collection_id:
          type: string
          description: The collection the version belongs to.
        collection_name:
          type: string
          description: A name for humans, defaulting to the collection's id.
        shape_ref:
          type: string
          description: The contract shape the corpus is mapped through.
        path_prefix:
          type: string
          description: |
            The path prefix that binds the collection, or empty for every source this deployment has. The binding is in
            the request rather than in the manifest: which sources a collection binds can change without the version
            changing.
        activate:
          type: boolean
          description: Whether the built version becomes the collection's live one. Off unless the caller says so.

    IndexActivation:
      type: object
      required: [collection_id]
      properties:
        collection_id:
          type: string
          description: The collection to cut over. A version can only be activated into its own collection.

    EnvelopeQuery:
      type: object
      required: [index_version]
      properties:
        index_version:
          type: string
          description: The version the answer named.
        ledger_watermark:
          type: integer
          format: int64
          description: The ledger position the answer's index reflected.
        sources:
          type: array
          description: The sources the answer cited.
          items:
            $ref: "#/components/schemas/SourceReference"

    EnvelopeResolution:
      type: object
      required: [resolved, unrecorded_content_hashes]
      properties:
        resolved:
          type: boolean
          description: Whether the version exists and the cited bytes are in it.
        failure:
          type: string
          description: Why the provenance does not hold up, or empty when it does.
        version:
          $ref: "#/components/schemas/IndexVersionState"
        unrecorded_content_hashes:
          type: array
          description: |
            The cited hashes the version's manifest does not record. A version records the bytes it indexed, so an
            answer citing bytes outside that set cannot have come from it - which is the part of provenance a mixed-up
            envelope cannot fake.
          items:
            type: string

    SourceList:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          description: The source rows, in path order, and never the bytes.
          items:
            $ref: "#/components/schemas/SourceInfo"

    IndexVersionList:
      type: object
      required: [collection_id, versions]
      properties:
        collection_id:
          type: string
        versions:
          type: array
          description: The collection's versions, live and superseded, latest build first.
          items:
            $ref: "#/components/schemas/IndexVersionState"

    EvidenceSeal:
      type: object
      required: [manifest]
      properties:
        manifest:
          $ref: "#/components/schemas/EvidenceManifest"
        bytes_base64:
          type: string
          description: |-
            The canonical bytes, base64, when they travel with the seal. Omit them to take a grant instead, which is what
            a set of bytes over the inline cap has to do.

    SealedEvidence:
      type: object
      required: [evidence_id, state, created]
      properties:
        evidence_id:
          type: string
          description: The identity the server assigned.
        state:
          type: string
          description: |-
            The recorded artifact's state, not a constant: a seal that lost the domain-key race to another one hands back
            the winner's identity, and that artifact is pending until its own bytes are committed.
          enum: [pending, committed, purged]
        created:
          type: boolean
          description: Whether this call created the artifact rather than finding the seal already made.
        grant:
          $ref: "#/components/schemas/EvidenceUploadGrant"

    EvidenceUploadGrant:
      type: object
      required: [grant_id, expires_at]
      properties:
        grant_id:
          type: string
        expires_at:
          type: string
          description: When the grant stops being usable.

    EvidenceBytesUpload:
      type: object
      required: [bytes_base64]
      properties:
        bytes_base64:
          type: string
          description: |-
            The artifact's bytes, base64. Base64 rather than the octet stream the original takes, because this port's
            surfaces are JSON by design - the same choice its ingest route makes for a document - and the canonical form
            includes Parquet, which is not text.

    CommittedEvidence:
      type: object
      required: [evidence_id, state, committed]
      properties:
        evidence_id:
          type: string
        state:
          type: string
          enum: [pending, committed, purged]
        committed:
          type: boolean
          description: |-
            Whether this call committed it. False when it was committed already, or when its bytes are gone - a purge is
            not undone by a commit arriving late, and calling that committed would be the lie the row exists to prevent.

    EvidenceManifest:
      type: object
      description: |-
        Everything needed to prove what an answer was computed from, decide who may read it, and say honestly whether it
        can be replayed. The bytes are separate: this names them by `artifact_hash` and never embeds them. Absent fields
        mean "not applicable to this kind", never "unknown" - the two are different claims and a reader deciding whether
        to trust a result needs to know which one it has.
      required: [contract_version, canon, tenant, kind, logical_result_hash, artifact_hash, bytes_len, media_type, source, versions, schema, identity, completeness, snapshot_vector, execution, authorization_class]
      properties:
        contract_version:
          type: string
          description: The contract version the producer built against. A major that differs from this server's is a wire break.
        canon:
          type: string
          description: The canonicalization version. This contract major implements exactly one.
          enum: [canon@1]
        evidence_id:
          type: string
          description: |-
            Assigned by the server at seal: absent in a seal request and present in every read, which is what makes the
            identity a property of the deployment rather than a claim by the caller.
        tenant:
          type: string
        kind:
          type: string
          description: |-
            Closed: a new member is a major contract bump, because a reader that does not recognize a kind cannot say
            what it is holding.
          enum: [table, count, observations]
        logical_result_hash:
          type: string
          description: |-
            The hash of the logical result, which is what makes two seals of one answer the same seal. It does not move
            when the same logical result is re-serialized.
        artifact_hash:
          type: string
          description: The hash of the serialized bytes as they were written.
        bytes_len:
          type: integer
          format: int64
        media_type:
          type: string
          description: How the bytes are serialized. Both are canonical forms; the CSV one exists so a small artifact is readable without a Parquet reader.
          enum: ["application/vnd.apache.parquet", "text/csv; charset=utf-8"]
        source:
          $ref: "#/components/schemas/EvidenceSource"
        versions:
          $ref: "#/components/schemas/EvidenceVersions"
        plan:
          $ref: "#/components/schemas/EvidencePlan"
        schema:
          $ref: "#/components/schemas/EvidenceSchema"
        identity:
          $ref: "#/components/schemas/EvidenceIdentity"
        completeness:
          $ref: "#/components/schemas/EvidenceCompleteness"
        redaction:
          $ref: "#/components/schemas/EvidenceRedaction"
        snapshot_vector:
          type: array
          description: |-
            One marker per source that contributed. It is a vector and not a single marker precisely so a cross-source
            result is never described as one atomic snapshot: no single engine's snapshot covers two engines.
          items:
            $ref: "#/components/schemas/EvidenceSnapshotMarker"
        freshness:
          $ref: "#/components/schemas/EvidenceFreshness"
        execution:
          $ref: "#/components/schemas/EvidenceExecution"
        authorization_class:
          $ref: "#/components/schemas/EvidenceAuthorizationClass"
        retention:
          $ref: "#/components/schemas/EvidenceRetention"

    EvidenceSource:
      type: object
      description: Which source a result came from, and what executed it - provenance, not identity.
      required: [source_id, source_version, adapter]
      properties:
        source_id:
          type: string
        source_version:
          type: integer
          format: int64
        adapter:
          type: string
          description: "An open vocabulary: postgres, databricks, landing, and whatever comes next."
        adapter_version:
          type: string
        engine:
          type: string
          description: What actually executed it, as the engine reports itself. Part of the provenance, not of the logical identity.
        driver:
          type: string

    EvidenceVersions:
      type: object
      description: Every versioned artifact that shaped a result. An absent one means "not applicable to this kind", never "unknown".
      properties:
        query_contract:
          type: string
          description: A verified query contract executed the statement its author wrote; the model never wrote SQL.
        claim_mapping:
          type: string
        semantic_provider:
          type: string
          description: A metric view or native data view answered a bounded semantic intent.
        render:
          type: string
        policy:
          type: string
        compiler:
          type: string

    EvidencePlan:
      type: object
      description: Hashes of the compiled plan and the bound parameters. The statement text is never sealed and never leaves the engine.
      properties:
        canonical_plan_hash:
          type: string
        bound_parameters_hash:
          type: string

    EvidenceSchema:
      type: object
      required: [columns]
      properties:
        columns:
          type: array
          description: The columns, in result order. These names are what the row read keys its rows by.
          items:
            $ref: "#/components/schemas/EvidenceColumn"

    EvidenceColumn:
      type: object
      description: |-
        One column of a sealed result. The identity and the name are separate because a source may rename a column
        without changing what it means: a consumer keyed on the name would see a new column where nothing changed.
      required: [id, name, type]
      properties:
        id:
          type: string
          description: The stable identity, which survives a rename of the source column.
        name:
          type: string
          description: The column's name as the source reports it.
        type:
          type: string
          description: |-
            Closed, and deliberately logical rather than physical: the canonical scalar encodings are defined exactly over
            this set, so a type that only exists in one engine's type system would have no encoding.
          enum: [bool, int64, decimal, float64, string, bytes, date, timestamp_tz, timestamp_naive, interval, uuid, json, array]
        nullable:
          type: boolean
          default: false
        scale:
          type: integer
          format: int64
          description: The decimal scale, when the type has one.
        unit:
          type: string
          description: The unit, such as USD or seconds, carried so a number is never unitless.
        additivity:
          type: string
          description: "An open vocabulary: additive, semi_additive, none."
        key:
          type: boolean
          description: Whether the column is part of the row identity.
        element_type:
          type: string
          description: The element type of an array column.

    EvidenceIdentity:
      type: object
      required: [row_id_rule]
      properties:
        row_id_rule:
          type: string
          description: |-
            How rows are identified. Positional row ids are legal only under a total ordering, which is why the server
            refuses a manifest that declares them with nothing to order by.
          enum: [keys, position]
        order_by:
          type: array
          description: The declared ordering, which a positional rule requires to be total.
          items:
            type: string
        rows:
          type: integer
          format: int64
          description: How many rows the result held, when the producer says so.

    EvidenceCompleteness:
      type: object
      required: [truncated]
      properties:
        truncated:
          type: boolean
          description: Whether rows were cut off. A truncated result supports "at least this many", never "exactly this many".
        declared_max_rows:
          type: integer
          format: int64
        rows_covered:
          type: integer
          format: int64
          description: How many source rows the run covered.
        rows_excluded:
          type: integer
          format: int64
          description: How many rows policy or drift excluded, which are reported and never silently dropped.
        exclusion_reason:
          type: string

    EvidenceRedaction:
      type: object
      description: |-
        What a policy removed before the bytes were written. A denied column was never selected, so it is absent from the
        bytes rather than blank; naming it here is how an operator sees why a column is missing instead of inferring it
        from a gap.
      properties:
        denied_columns:
          type: array
          items:
            type: string
        masked:
          type: boolean

    EvidenceSnapshotMarker:
      type: object
      description: |-
        One marker per source that contributed. A cross-source result carries a vector of markers precisely so it is never
        described as one atomic snapshot: no single engine's snapshot covers two engines.
      required: [source_id, replay_level]
      properties:
        source_id:
          type: string
        marker:
          type: string
          description: "Engine-native: a snapshot, a table version, a manifest id."
        isolation:
          type: string
        started_at:
          type: string
        ended_at:
          type: string
        replay_level:
          type: string
          description: "What re-running would give you. An open vocabulary: sealed_result, source_time_travel, or less."
        replay_expires_at:
          type: string

    EvidenceFreshness:
      type: object
      description: How current the data behind a result was.
      properties:
        watermark:
          type: string
          description: The source's watermark.
        observed_at:
          type: string
          description: When the data was observed.
        lag_seconds:
          type: integer
          format: int64

    EvidenceExecution:
      type: object
      required: [started_at, ended_at]
      properties:
        started_at:
          type: string
        ended_at:
          type: string
        effective_principal:
          type: string
          description: |-
            The identity the source saw, such as a row-level-security role - deliberately not the end user's: what matters
            for reproducing a result is the principal the engine applied its own policy to, not who asked.
        statement_id:
          type: string

    EvidenceAuthorizationClass:
      type: object
      description: |-
        The equivalence class an artifact belongs to. A resolving session must dominate it: level at least the artifact's,
        and every compartment it declares. The rule is the same one the collection access path applies, on purpose -
        evidence is not a weaker class of data than the documents beside it.
      required: [access_level]
      properties:
        name:
          type: string
        access_level:
          type: integer
          format: int64
        compartments:
          type: array
          items:
            type: string

    EvidenceRetention:
      type: object
      properties:
        expires_at:
          type: string
          description: When the artifact's bytes may be deleted, as an RFC 3339 instant.
        legal_hold:
          type: boolean
          description: Whether a hold stops the purge. A hold blocks deletion and never reading.
        purged_at:
          type: string
          description: |-
            Set by the sweep or by an operator. A purged artifact keeps its row so a citation resolves `evidence-expired`
            rather than `not-found`.

    EvidenceRow:
      type: object
      description: |-
        One sealed row, keyed by the column names the manifest's schema declares - the names are the contract, and a row
        that disagreed with them would be the schema drifting silently. A value is a string or null: an empty value and no
        value are different claims, and this plane exists to keep them apart.

        This is the one shape in the contract with no faithful protobuf form, which is why the row read that returns it is
        JSON-only: a protobuf map's values cannot be null, so a row carried over gRPC would have to collapse that
        distinction to travel at all.
      properties: {}

    EvidenceRows:
      type: object
      required: [evidence_id, from, has_more, rows, total]
      properties:
        evidence_id:
          type: string
        from:
          type: integer
          format: int64
          description: The first row this page starts at.
        has_more:
          type: boolean
          description: Whether there are rows after this page, which is what a caller needs to know rather than an estimate.
        rows:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceRow"
        total:
          type: integer
          format: int64
          description: How many rows the artifact holds in all, so a caller knows how far it can page.

    EvidenceAccess:
      type: object
      required: [uid, kind, outcome, at]
      properties:
        uid:
          type: string
          description: Who resolved it.
        kind:
          $ref: "#/components/schemas/EvidenceAccessKind"
        row_from:
          type: integer
          format: int64
        row_limit:
          type: integer
          format: int64
        outcome:
          type: string
          enum: [ok, denied, expired, on-hold]
        at:
          type: string
          description: When the read happened.

    EvidenceAccessKind:
      type: string
      description: |-
        What a resolution was about. A resolution records *that* a read happened and never the rows read: an audit
        table holding the regulated data it audits would be a second copy of the problem the audit exists to describe.
      enum: [manifest, rows]

    EvidenceAccesses:
      type: object
      required: [evidence_id, accesses]
      properties:
        evidence_id:
          type: string
        accesses:
          type: array
          description: The resolutions, newest first.
          items:
            $ref: "#/components/schemas/EvidenceAccess"

    PurgedEvidence:
      type: object
      required: [evidence_id, purged, state]
      properties:
        evidence_id:
          type: string
        purged:
          type: boolean
          description: Whether this call purged it, rather than finding it purged already.
        state:
          type: string
          enum: [purged]

    LegalHoldRequest:
      type: object
      required: [hold]
      properties:
        hold:
          type: boolean
          description: Whether to place the hold, or lift it.

    RunbookApply:
      type: object
      required: [yaml]
      properties:
        yaml:
          type: string
          description: |
            The runbook as written. It is kept verbatim beside the mapping it produced: the mapping is what runs, and the
            bytes are what the operator wrote.

    AppliedRunbook:
      type: object
      required: [runbook_ref, name, version, status]
      properties:
        runbook_ref:
          type: string
          description: The pinned reference, name@version, which is what a session will name.
        name:
          type: string
        version:
          type: integer
          format: int32
        status:
          type: string
          enum: [active, remove_requested, removed]
        created_at:
          type: string
          description: When this version was first applied.
        updated_at:
          type: string
          description: When it was last applied, which is the same as created_at until it is re-applied.

    RunbookVersion:
      type: object
      required: [runbook_ref, name, version, status]
      properties:
        runbook_ref:
          type: string
        name:
          type: string
        version:
          type: integer
          format: int32
        status:
          type: string
          enum: [active, remove_requested, removed]
        removal_id:
          type: string
          description: The removal this version is armed with, when one is in flight. The YAML is never deleted.
        removal_requested_at:
          type: string
        removal_requested_by:
          type: string
        removed_at:
          type: string
        created_at:
          type: string
        updated_at:
          type: string

    SessionCreated:
      type: object
      required: [session_id, runbook_ref, permitted_collections]
      properties:
        session_id:
          type: string
        runbook_ref:
          type: string
          description: The version this session pinned, name@version, which every turn reads.
        permitted_collections:
          type: array
          description: The collections the clearance covers, in the document's order.
          items:
            type: string

    TurnRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        top_k:
          type: integer
          format: int32
          description: How many chunks the answer may carry, or absent for the runbook's own.
        complete:
          type: boolean
          description: |-
            Whether the runbook's completion step runs, when it declares one. Absent means run it: a caller that asked a
            question of a runbook that declares a completion is asking to be answered.
        research_profile:
          type: string
          description: The profile to run under, or absent for the runbook's default.

    TurnHit:
      type: object
      required: [chunk_id, source_path, score, text]
      properties:
        chunk_id:
          type: string
          description: The chunk's identity, which is also the label a citation names.
        source_path:
          type: string
        score:
          type: number
          format: double
        text:
          type: string

    TurnSource:
      type: object
      required: [chunk_id, source_path, content_hash]
      properties:
        chunk_id:
          type: string
        source_path:
          type: string
        content_hash:
          type: string

    TurnEnvelope:
      type: object
      required: [index_version, ledger_watermark, sources]
      properties:
        index_version:
          type: string
        ledger_watermark:
          type: integer
          format: int64
        sources:
          type: array
          items:
            $ref: "#/components/schemas/TurnSource"

    TurnVerification:
      type: object
      required: [checks, retries, first_pass_violations, violations]
      properties:
        checks:
          type: array
          description: The checks that ran, in the order a report lists them.
          items:
            type: string
        retries:
          type: integer
          format: int32
        first_pass_violations:
          type: array
          description: What the first answer failed, before any correction.
          items:
            type: string
        violations:
          type: array
          description: What the last one failed, or empty when it stands clean.
          items:
            type: string

    TurnCompletion:
      type: object
      required: [text, input_tokens, output_tokens, completions, retried_for_truncation, verification]
      properties:
        text:
          type: string
          description: The answer that stands.
        input_tokens:
          type: integer
          format: int32
          description: Tokens across every call the turn paid for, not only the answer that stands.
        output_tokens:
          type: integer
          format: int32
        completions:
          type: integer
          format: int32
        retried_for_truncation:
          type: boolean
        verification:
          $ref: "#/components/schemas/TurnVerification"

    TurnProgressEvent:
      type: object
      description: |-
        One progress event on the streaming turn plane, tagged by `stage`. The original's vocabulary is flat - one event
        type with a stage discriminator - so this schema carries every stage's fields and an event sets only its own:
        `probe`, `selection`, `expansion` and `retrieval` come from the retrieval path's own stages, `merge` from the
        fusion over them, `model`, `completion` and `verify` from answering, and `profile`, `layer_start`, `layer_source`,
        `layer_complete`, `coverage` and `compose` from a research profile. A stage a turn never crosses produces no
        event at all.
      required: [stage]
      properties:
        stage:
          type: string
          description: Which stage is reporting.
          enum: [probe, selection, expansion, retrieval, merge, model, completion, verify, profile, layer_start, layer_source, layer_complete, coverage, compose]
        collection:
          type: string
          description: The collection a `probe` or `retrieval` event is about.
        hits:
          type: integer
          format: int32
          description: How many hits a `probe`, `retrieval` or `merge` event carried.
        skipped:
          type: boolean
          description: Whether a `probe` or `retrieval` skipped a collection that has no active index.
        probed:
          type: integer
          format: int32
          description: How many collections a `selection` event probed.
        selected:
          type: integer
          format: int32
          description: How many of them a `selection` event chose for the deep search.
        collections:
          type: array
          description: The chosen collections, in the runbook's order.
          items:
            type: string
        provider:
          type: string
          description: The provider that served or answered with the event's model.
        model:
          type: string
          description: The concrete model that answered.
        terms:
          type: array
          description: The lexical variants an `expansion` event accepted, possibly none.
          items:
            type: string
        input_tokens:
          type: integer
          format: int64
          description: What the call cost to send.
        output_tokens:
          type: integer
          format: int64
          description: What the call cost to generate.
        tier:
          type: string
          description: The tier a `model` event resolved when it resolved a tier rather than a model.
        was_override:
          type: boolean
          description: Whether the model or tier came from the caller rather than the runbook.
        attempt:
          type: integer
          format: int32
          description: Zero for the answer and the truncation re-ask, one upward for each corrective retry.
        checks:
          type: array
          description: The checks that ran, in the order a report lists them.
          items:
            type: string
        violations:
          type: integer
          format: int32
          description: How many violations the check found. A non-zero count may buy a corrective retry.
        layer:
          type: string
          description: The layer a `verify` event checked, when a hierarchy was in play.
        role:
          type: string
          description: The weight a `layer_start` event's evidence carries.
        requirement:
          type: string
          description: Whether a `layer_start` event's evidence is required, optional or a fallback.
        source:
          type: string
          description: The pinned source a `layer_source` event bound.
        block:
          type: string
          description: The kind of block a `layer_complete` event produced.
        supports_completeness:
          type: boolean
          description: Whether that block permits a completeness claim.
        refusal_code:
          type: string
          description: The refusal's code, when a `layer_complete` event reports a layer that declined.
        elapsed_ms:
          type: integer
          format: int64
          description: How long the layer took.
        completeness_available:
          type: boolean
          description: Whether any block of the run permits a completeness claim.
        disclosed_conflicts:
          type: integer
          format: int32
          description: How many conflicts between layers a `coverage` event preserved for disclosure.
        layers:
          type: array
          description: The layers a `profile` event resolved, in execution order.
          items:
            type: string
        intent_kind:
          type: string
          description: The intent's kind, when it had one.
        intent_explicit:
          type: boolean
          description: Whether the intent was supplied rather than modelled.
        layers_used:
          type: integer
          format: int32
          description: How many layers a `compose` event put into the context.
        context_chars:
          type: integer
          format: int32
          description: How many characters that context came to.
        layers_dropped:
          type: array
          description: The layers that did not fit the budget. Dropped whole, never half.
          items:
            type: string

    LayerOutcome:
      type: object
      required: [layer, role, requirement, block, supports_completeness, elapsed_ms]
      properties:
        layer:
          type: string
        role:
          type: string
        requirement:
          type: string
        block:
          type: string
        evidence_id:
          type: string
        supports_completeness:
          type: boolean
        refusal_code:
          type: string
        elapsed_ms:
          type: integer
          format: int64

    HierarchyDecision:
      type: object
      required: [profile, intent_explicit, layers, completeness_available, disclosed_conflicts, conflicts_policy]
      properties:
        profile:
          type: string
        intent_kind:
          type: string
        intent_explicit:
          type: boolean
        layers:
          type: array
          items:
            $ref: "#/components/schemas/LayerOutcome"
        completeness_available:
          type: boolean
        disclosed_conflicts:
          type: integer
          format: int32
        conflicts_policy:
          type: string

    TurnResponse:
      type: object
      required: [ordinal, query, intent_explicit, collections_searched, hits, envelopes]
      properties:
        ordinal:
          type: integer
          format: int32
        query:
          type: string
        intent_kind:
          type: string
        intent_explicit:
          type: boolean
        collections_searched:
          type: array
          items:
            type: string
        hits:
          type: array
          items:
            $ref: "#/components/schemas/TurnHit"
        envelopes:
          type: array
          items:
            $ref: "#/components/schemas/TurnEnvelope"
        completion:
          $ref: "#/components/schemas/TurnCompletion"
        hierarchy:
          $ref: "#/components/schemas/HierarchyDecision"

    SessionTurn:
      type: object
      required: [ordinal, query, collections_searched, hits, envelope]
      properties:
        ordinal:
          type: integer
          format: int32
        query:
          type: string
        collections_searched:
          type: array
          items:
            type: string
        hits:
          type: string
          description: The merged hits, as the store recorded them, as JSON text.
        envelope:
          type: string
          description: The provenance, as the store recorded it, as JSON text.
        completion:
          type: string
          description: The completion audit, when there was one, as JSON text.
        hierarchy:
          type: string
          description: The hierarchy decision, when a research profile ran, as JSON text.
        created_at:
          type: string

    SessionResponse:
      type: object
      required: [session_id, uid, runbook_ref, access_level, compartments, state, turns]
      properties:
        session_id:
          type: string
        uid:
          type: string
        runbook_ref:
          type: string
        access_level:
          type: integer
          format: int32
        compartments:
          type: array
          items:
            type: string
        state:
          type: string
          description: |-
            Where the session stands: open, closed or expired.
        created_at:
          type: string
        last_turn_at:
          type: string
        turns:
          type: array
          description: The turns, oldest first.
          items:
            $ref: "#/components/schemas/SessionTurn"

    SessionClosed:
      type: object
      required: [session_id, state]
      properties:
        session_id:
          type: string
        state:
          type: string
          description: |-
            Where it now stands: open, closed or expired.

        version:
          type: integer
          format: int32
        status:
          type: string
          enum: [active, remove_requested, removed]
        removal_id:
          type: string
          description: The removal this version is armed with, when one is in flight. The YAML is never deleted.
        removal_requested_at:
          type: string
        removal_requested_by:
          type: string
        removed_at:
          type: string
        created_at:
          type: string
        updated_at:
          type: string

    RunbookList:
      type: object
      required: [runbooks]
      properties:
        runbooks:
          type: array
          description: The applied versions, in name and then version order.
          items:
            $ref: "#/components/schemas/RunbookVersion"


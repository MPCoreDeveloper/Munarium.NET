# SonarCloud configuration for Munarium.NET.
# The project key and organization must match your SonarCloud account.
sonar.projectKey=MPCoreDeveloper_Munarium.NET
sonar.organization=mpcoredeveloper
sonar.projectName=Munarium.NET
sonar.projectVersion=0.1.0-preview.1
sonar.sourceEncoding=UTF-8

# C# analysis is driven by the SonarScanner for .NET around an MSBuild build.
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/*.trx

# Generated and build output are excluded from analysis.
sonar.exclusions=**/bin/**,**/obj/**,**/artifacts/**,**/*.g.cs,**/*.Designer.cs
sonar.test.exclusions=**/tests/**
sonar.coverage.exclusions=**/tests/**,**/*.g.cs

# Keep analysis deterministic across CI runs.
sonar.scm.provider=git

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CONFIGURATION: Release

jobs:
  build-test-sonar:
    name: Build, test and SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-rc.1.26425.128

      - name: Restore local tools
        run: dotnet tool restore

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'NuGet.config') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # The SonarScanner for .NET does not read sonar-project.properties; every
      # property is passed on `begin`. The project key and organization must match
      # the project you created on SonarCloud.
      - name: SonarScanner begin
        if: env.SONAR_TOKEN != ''
        run: >
          dotnet sonarscanner begin
          /k:"MPCoreDeveloper_Munarium.NET"
          /o:"mpcoredeveloper"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.sourceEncoding="UTF-8"
          /d:sonar.scm.provider="git"
          /d:sonar.exclusions="**/bin/**,**/obj/**,**/artifacts/**,**/*.g.cs,**/*.Designer.cs"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          /d:sonar.cs.vstest.reportsPaths="**/TestResults/*.trx"

      - name: Build
        run: dotnet build Munarium.slnx -c $CONFIGURATION --no-incremental

      - name: Test
        run: dotnet test Munarium.slnx -c $CONFIGURATION --no-build

      # A failing suite has to say which test failed. The reporter prints a summary and points at the
      # platform log, which lives under the test output - so a red build says "1 of 159 failed" and
      # nothing more, and the runner takes the reason with it. The log is printed here, and uploaded,
      # because a log line needs no download. Measured: --output Detailed is accepted by this
      # configuration and still prints only the summary, so the log is where the detail lives.
      - name: Show what failed
        if: failure()
        shell: bash
        run: |
          find tests -path '*/TestResults/*.log' -print0 | while IFS= read -r -d '' log; do
            echo "=== $log"
            tail -n 300 "$log"
          done

      - name: Keep the test results when the suite fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/**
          if-no-files-found: ignore
          retention-days: 7

      - name: SonarScanner end
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      # A release pushes exactly what this step produces, so the packages are built and read back on
      # every push rather than first at the tag. tools/release-packages.ps1 checks the set of packages
      # and, inside each one, the symbols, licence, notice, credits, readme and icon that a release is
      # expected to carry. The pack output is not uploaded anywhere: the release workflow packs again.
      - name: Pack and check the release packages
        run: pwsh tools/release-packages.ps1 -Configuration ${{ env.CONFIGURATION }} -NoBuild

  # NativeAOT and platform independence, proven per platform: publish the smoke tool as a fully
  # AOT-compiled native binary and run it. A reflection or codegen hazard fails this job.
  aot-smoke:
    name: NativeAOT smoke (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-rc.1.26425.128

      - name: Publish NativeAOT
        run: dotnet publish tools/Munarium.AotSmoke/Munarium.AotSmoke.csproj -c Release -r ${{ matrix.rid }} -o artifacts/aot-smoke

      - name: Run the AOT smoke test
        shell: bash
        run: |
          cd artifacts/aot-smoke
          if [ -f Munarium.AotSmoke ]; then
            binary=Munarium.AotSmoke
          elif [ -f Munarium.AotSmoke.exe ]; then
            binary=Munarium.AotSmoke.exe
          else
            echo "::error::AOT binary not found; publish output was:"
            ls -la
            exit 1
          fi
          echo "Running ./$binary on ${{ matrix.rid }}"
          ./$binary
